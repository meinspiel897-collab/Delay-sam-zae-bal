<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>СамоСобой</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif !important;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 
           ЗАГОЛОВОК: Выровнен строго по оси Y с нативными кнопками Telegram.
           Используем safe-area + стандартную высоту плашки 44px.
        */
        header {
            position: absolute;
            top: var(--tg-safe-area-inset-top, env(safe-area-inset-top, 0px));
            left: 0;
            right: 0;
            height: 44px; 
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            pointer-events: none; /* Чтобы не перекрывать клики интерфейса */
        }

        /* ГЛАВНЫЙ КОНТЕЙНЕР */
        .radar-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 75vw;
            max-width: 320px;
            aspect-ratio: 1 / 1;
        }

        /* БАЗОВЫЙ КЛАСС ДЛЯ ЦЕНТРИРОВАНИЯ И ВРАЩЕНИЯ СЛОЕВ */
        .layer-absolute {
            position: absolute;
            top: 50%;
            left: 50%;
            transform-origin: center;
            overflow: visible;
        }

        /* --- ВОЛНОВЫЕ КРУГИ --- */
        .circle-layer-1 {
            width: 100%; height: 100%;
            fill: #006DF9; opacity: 0.9;
            z-index: 1;
            animation: rotateCounter 25s linear infinite;
        }
        .circle-layer-2 {
            width: 114%; height: 114%;
            fill: #006DF9; opacity: 0.45;
            z-index: 1;
            animation: rotateClock 18s linear infinite;
        }
        .circle-layer-3 {
            width: 128%; height: 128%;
            fill: #006DF9; opacity: 0.15;
            z-index: 1;
            animation: rotateCounter 30s linear infinite;
        }

        /* --- СЕТКА РАДАРА --- */
        .radar-grid {
            width: 100%; height: 100%;
            z-index: 2;
            pointer-events: none;
        }
        .radar-grid circle, .radar-grid line {
            stroke: #006DF9;
        }

        /* --- ВРАЩАЮЩИЙСЯ ЛУЧ РАДАРА --- */
        .radar-sweep {
            width: 96%; height: 96%;
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent 65%, rgba(0, 109, 249, 0.15) 96%, rgba(0, 109, 249, 0.95) 100%);
            z-index: 3;
            pointer-events: none;
            animation: sweepRotate 4s linear infinite;
        }

        /* --- КОНТЕЙНЕР ДЛЯ LOTTIE КИТА --- */
        .lottie-whale-box {
            width: 65%; /* Крупный, но не выходит за рамки */
            height: 65%;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            animation: whaleRadarPing 5s ease-in-out infinite;
        }

        /* АНИМАЦИИ */
        @keyframes rotateClock {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
        @keyframes rotateCounter {
            0% { transform: translate(-50%, -50%) rotate(360deg); }
            100% { transform: translate(-50%, -50%) rotate(0deg); }
        }
        @keyframes sweepRotate {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* Тайминг Кита: 0.5с появление -> 3с горит -> 0.5с исчезает -> 1с невидимый */
        @keyframes whaleRadarPing {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.95); }
            10% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            70% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            80% { opacity: 0; transform: translate(-50%, -50%) scale(0.95); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(0.95); }
        }
    </style>
</head>
<body>

    <!-- Шапка центрируется ровно по высоте нативных кнопок -->
    <header>
        <div class="flex items-center space-x-2.5">
            <img 
                src="public/icons/logo.png" 
                alt="Логотип" 
                class="w-5 h-5 object-contain"
                onerror="this.style.display='none'"
            />
            <h1 class="text-base font-semibold tracking-tight text-white uppercase">
                СамоСобой
            </h1>
        </div>
    </header>

    <!-- Главная рабочая зона -->
    <div class="radar-container">
        
        <!-- Слой 3 (Задний фон: Размашистые волны) -->
        <svg class="layer-absolute circle-layer-3" viewBox="0 0 200 200">
            <path d="M 100, 2 C 140, 10 180, 25 198, 90 C 215, 155 150, 195 100, 198 C 50, 201 -5, 150 2, 90 C 10, 30 60, -5 100, 2 Z" />
        </svg>

        <!-- Слой 2 (Средний: Средние волны) -->
        <svg class="layer-absolute circle-layer-2" viewBox="0 0 200 200">
            <path d="M 100, 5 C 135, 2 190, 30 195, 100 C 200, 170 145, 198 100, 195 C 55, 192 2, 160 5, 100 C 8, 40 65, 8 100, 5 Z" />
        </svg>

        <!-- Слой 1 (Передний: Плотный, почти идеальный круг с микро-дыханием) -->
        <svg class="layer-absolute circle-layer-1" viewBox="0 0 200 200">
            <path d="M 100, 5 C 150, 7 193, 50 195, 100 C 197, 150 150, 193 100, 195 C 50, 197 7, 150 5, 100 C 3, 50 50, 3 100, 5 Z" />
        </svg>

        <!-- Статичная разметка радара (вписана в первый круг) -->
        <svg class="layer-absolute radar-grid" viewBox="0 0 200 200">
            <!-- 3 концентрических кольца -->
            <circle cx="100" cy="100" r="95" fill="none" stroke-width="1.5" opacity="0.6"/>
            <circle cx="100" cy="100" r="65" fill="none" stroke-width="1" opacity="0.3" stroke-dasharray="4 4"/>
            <circle cx="100" cy="100" r="35" fill="none" stroke-width="1" opacity="0.3"/>
            <!-- Визирные оси -->
            <line x1="100" y1="5" x2="100" y2="195" stroke-width="1" opacity="0.4"/>
            <line x1="5" y1="100" x2="195" y2="100" stroke-width="1" opacity="0.4"/>
        </svg>

        <!-- Вращающийся луч радара -->
        <div class="layer-absolute radar-sweep"></div>

        <!-- Lottie Анимация Кита -->
        <div class="layer-absolute lottie-whale-box">
            <lottie-player 
                src="public/gifs/whale.json" 
                background="transparent" 
                speed="1" 
                loop 
                autoplay
                style="width: 100%; height: 100%; object-fit: contain;">
            </lottie-player>
        </div>

    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        
        // Разворачиваем и запрашиваем FullScreen (для новых версий TWA)
        tg.expand();
        if (tg.requestFullscreen) {
            tg.requestFullscreen();
        }
        
        // Перекрашиваем верхний и нижний системные бары в черный
        tg.setHeaderColor('#000000');
        tg.setBackgroundColor('#000000');
    </script>
</body>
</html>
