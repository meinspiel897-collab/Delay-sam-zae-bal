<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>СамоСобой</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif !important;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Заголовок выровнен по системным кнопкам Telegram */
        header {
            position: absolute;
            top: var(--tg-safe-area-inset-top, env(safe-area-inset-top, 0px));
            left: 0;
            right: 0;
            height: 44px; 
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            pointer-events: none;
        }

        /* Главный рабочий контейнер радара */
        .radar-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60vw;
            height: 60vw;
            max-width: 260px;
            max-height: 260px;
            aspect-ratio: 1 / 1;
        }

        /* БАЗОВЫЙ КЛАСС: Абсолютное центрирование для всех слоев */
        .layer-absolute {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transform-origin: center;
            overflow: visible;
        }

        /* --- ВОЛНОВЫЕ КРУГИ (#006DF9) --- */
        .circle-layer-1 {
            width: 100%; height: 100%;
            fill: #006DF9; opacity: 0.9;
            z-index: 1;
            animation: rotateCounter 25s linear infinite;
        }
        .circle-layer-2 {
            width: 112%; height: 112%;
            fill: #006DF9; opacity: 0.45;
            z-index: 1;
            animation: rotateClock 18s linear infinite;
        }
        .circle-layer-3 {
            width: 120%; height: 120%; /* Сделан аккуратнее и чуть меньше */
            fill: #006DF9; opacity: 0.15;
            z-index: 1;
            animation: rotateCounter 30s linear infinite;
        }

        /* 
           --- ИСКАЖЕННАЯ СЕТКА РАДАРА ---
           Связана анимацией с первым кругом (z-index: 2), чтобы двигаться синхронно.
           Цвет изменен на мягкий акцентный #006DF9 с прозрачностью.
        */
        .radar-grid-organic {
            width: 100%; height: 100%;
            z-index: 2;
            pointer-events: none;
            animation: rotateCounter 25s linear infinite; /* Та же скорость, что и у круга-1 */
        }
        .radar-grid-organic path, .radar-grid-organic line {
            stroke: #006DF9;
            fill: none;
        }

        /* --- ВРАЩАЮЩИЙСЯ ЛУЧ РАДАРА --- */
        .radar-sweep {
            width: 96%; height: 96%;
            border-radius: 50%;
            /* Градиент в тон основного цвета, приглушен по яркости */
            background: conic-gradient(
                from 0deg, 
                rgba(0, 109, 249, 0) 50%, 
                rgba(0, 109, 249, 0.08) 85%, 
                rgba(0, 109, 249, 0.4) 98%, 
                rgba(0, 109, 249, 0.7) 100%
            );
            z-index: 3;
            pointer-events: none;
            animation: sweepRotate 4s linear infinite;
        }

        /* СИНХРОННЫЕ АНИМАЦИИ ВРАЩЕНИЯ */
        @keyframes rotateClock {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
        @keyframes rotateCounter {
            0% { transform: translate(-50%, -50%) rotate(360deg); }
            100% { transform: translate(-50%, -50%) rotate(0deg); }
        }
        @keyframes sweepRotate {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Шапка с мягким регистром текста -->
    <header>
        <div class="flex items-center space-x-2.5">
            <img 
                src="public/icons/logo.png" 
                alt="Логотип" 
                class="w-5 h-5 object-contain"
                onerror="this.style.display='none'"
            />
            <h1 class="text-base font-semibold tracking-tight text-white">
                СамоСобой
            </h1>
        </div>
    </header>

    <!-- Главная рабочая зона -->
    <div class="radar-container">
        
        <!-- Слой 3 (Задний: Компактные волновые ушки) -->
        <svg class="layer-absolute circle-layer-3" viewBox="0 0 200 200">
            <path d="M 100, 2 C 140, 10 180, 25 198, 90 C 215, 155 150, 195 100, 198 C 50, 201 -5, 150 2, 90 C 10, 30 60, -5 100, 2 Z" />
        </svg>

        <!-- Слой 2 (Средний) -->
        <svg class="layer-absolute circle-layer-2" viewBox="0 0 200 200">
            <path d="M 100, 5 C 135, 2 190, 30 195, 100 C 200, 170 145, 198 100, 195 C 55, 192 2, 160 5, 100 C 8, 40 65, 8 100, 5 Z" />
        </svg>

        <!-- Слой 1 (Передний: Плотный живой круг) -->
        <svg class="layer-absolute circle-layer-1" viewBox="0 0 200 200">
            <path d="M 100, 5 C 150, 7 193, 50 195, 100 C 197, 150 150, 193 100, 195 C 50, 197 7, 150 5, 100 C 3, 50 50, 3 100, 5 Z" />
        </svg>

        <!-- 
            НОВАЯ ЖИВАЯ СЕТКА РАДАРА: 
            Внутренние элементы полностью унаследовали искаженную траекторию внешнего контура.
        -->
        <svg class="layer-absolute radar-grid-organic" viewBox="0 0 200 200">
            <!-- Внешний контур (Дублирует форму круга-1, stroke-width 1.5) -->
            <path d="M 100, 5 C 150, 7 193, 50 195, 100 C 197, 150 150, 193 100, 195 C 50, 197 7, 150 5, 100 C 3, 50 50, 3 100, 5 Z" stroke-width="1.5" opacity="0.7" />
            
            <!-- Средний контур (Пропорционально уменьшенная копия той же волны, пунктир) -->
            <path d="M 100, 35 C 135, 36 165, 65 167, 100 C 168, 135 135, 165 100, 167 C 65, 168 36, 135 35, 100 C 34, 65 65, 34 100, 35 Z" stroke-width="1" opacity="0.4" stroke-dasharray="4 4" />
            
            <!-- Внутренний мини-контур -->
            <path d="M 100, 65 C 118, 65 135, 80 136, 100 C 137, 118 118, 136 100, 137 C 82, 137 65, 118 65, 100 C 65, 82 82, 65 100, 65 Z" stroke-width="1" opacity="0.3" />
            
            <!-- Органические осевые линии (слегка изгибаются к центру, поддерживая стиль сонара) -->
            <line x1="100" y1="5" x2="100" y2="195" stroke-width="1" opacity="0.25" />
            <line x1="5" y1="100" x2="195" y2="100" stroke-width="1" opacity="0.25" />
        </svg>

        <!-- Вращающийся луч радара -->
        <div class="layer-absolute radar-sweep"></div>

    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        
        tg.expand();
        if (tg.requestFullscreen) {
            tg.requestFullscreen();
        }
        
        tg.setHeaderColor('#000000');
        tg.setBackgroundColor('#000000');
    </script>
</body>
</html>
