<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>СамоСобой</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif !important;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            overflow: hidden;
            height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }

        header {
            position: absolute;
            top: var(--tg-safe-area-inset-top, env(safe-area-inset-top, 0px));
            left: 0;
            right: 0;
            height: 44px; 
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            pointer-events: none;
        }

        /* КРУПНЫЙ РАДАР (НОРМАЛЬНЫЙ РАЗМЕР, сдвинут оптимально вниз) */
        .radar-box {
            position: absolute;
            top: 40%; 
            left: 50%;
            transform: translate(-50%, -50%);
            width: 76vw;
            height: 76vw; 
            max-width: 310px;
            max-height: 310px;
            aspect-ratio: 1 / 1;
            z-index: 10;
        }

        .layer-center {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- ФОНОВЫЕ ОРГАНИЧЕСКИЕ СЛОИ --- */
        .wave-1 { width: 100%; height: 100%; fill: #006DF9; opacity: 0.65; animation: rotCounter 24s linear infinite; }
        .wave-2 { width: 114%; height: 114%; fill: #006DF9; opacity: 0.26; animation: rotClock 18s linear infinite; }
        .wave-3 { width: 126%; height: 126%; fill: #006DF9; opacity: 0.10; animation: rotCounter 30s linear infinite; }

        /* --- ИМПУЛЬСНЫЕ КОЛЬЦА --- */
        .pulse-svg path {
            fill: none;
            stroke: rgba(215, 235, 255, 0.25);
            stroke-width: 1.0;
            transform-origin: 100px 100px;
        }
        .p-ring-1 { animation: sonar 3.5s cubic-bezier(0.1, 0.4, 0.2, 1) infinite; }
        .p-ring-2 { animation: sonar 3.5s cubic-bezier(0.1, 0.4, 0.2, 1) infinite; animation-delay: 1.75s; }

        /* --- Тонкие статические оси --- */
        .axes-svg path { fill: none; stroke: rgba(215, 235, 255, 0.12); stroke-width: 1; }

        /* --- ПРИГЛУШЕННЫЙ ЭЛЕГАНТНЫЙ ЛУЧ --- */
        .radar-sweep-beam {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(
                from 0deg, 
                transparent 60%, 
                rgba(0, 109, 249, 0.02) 80%, 
                rgba(0, 109, 249, 0.16) 96%, 
                rgba(215, 235, 255, 0.38) 100%
            );
            animation: sweep 4s linear infinite;
            transform-origin: center center;
        }

        /* МАЛЕНЬКИЕ НЕ-СВЕТЯЩИЕСЯ ТОЧКИ С КИНЕМАТОГРАФИЧНЫМ ЗАТУХАНИЕМ */
        .target-dot {
            position: absolute;
            width: 4px;
            height: 4px;
            background-color: #DCEBFC;
            border: 1px solid #0056C6;
            border-radius: 50%;
            opacity: 0;
            transform: scale(0.7);
            /* Сверхплавное исчезновение и появление (1 секунда) */
            transition: opacity 1.0s cubic-bezier(0.25, 1, 0.5, 1), transform 0.9s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 15;
        }
        .target-dot.active {
            opacity: 0.95;
            transform: scale(1);
        }

        /* АНИМАЦИИ */
        @keyframes sweep { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes rotClock { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes rotCounter { 0% { transform: rotate(360deg); } 100% { transform: rotate(0deg); } }
        @keyframes sonar {
            0% { transform: scale(0); opacity: 0.6; }
            70% { opacity: 0.2; }
            100% { transform: scale(1.08); opacity: 0; }
        }
    </style>
</head>
<body>

    <header>
        <div class="flex items-center space-x-2.5">
            <img src="public/icons/logo.png" alt="Логотип" class="w-5 h-5 object-contain" onerror="this.style.display='none'"/>
            <h1 class="text-base font-semibold tracking-tight text-white">СамоСобой</h1>
        </div>
    </header>

    <main class="w-full h-full relative">
        
        <div class="radar-box" id="radarZone">
            
            <div class="layer-center z-1">
                <svg class="wave-3" viewBox="0 0 200 200"><path d="M 100, 2 C 140, 10 180, 25 198, 90 C 215, 155 150, 195 100, 198 C 50, 201 -5, 150 2, 90 C 10, 30 60, -5 100, 2 Z" /></svg>
            </div>

            <div class="layer-center z-2">
                <svg class="wave-2" viewBox="0 0 200 200"><path d="M 100, 5 C 135, 2 190, 30 195, 100 C 200, 170 145, 198 100, 195 C 55, 192 2, 160 5, 100 C 8, 40 65, 8 100, 5 Z" /></svg>
            </div>

            <div class="layer-center z-3">
                <svg class="wave-1" viewBox="0 0 200 200"><path d="M 100, 5 C 150, 7 193, 50 195, 100 C 197, 150 150, 193 100, 195 C 50, 197 7, 150 5, 100 C 3, 50 50, 3 100, 5 Z" /></svg>
            </div>

            <div class="layer-center z-4 pointer-events-none">
                <svg class="pulse-svg w-full h-full" viewBox="0 0 200 200">
                    <path class="p-ring-1" d="M 100, 5 C 150, 7 193, 50 195, 100 C 197, 150 150, 193 100, 195 C 50, 197 7, 150 5, 100 C 3, 50 50, 3 100, 5 Z" />
                    <path class="p-ring-2" d="M 100, 5 C 150, 7 193, 50 195, 100 C 197, 150 150, 193 100, 195 C 50, 197 7, 150 5, 100 C 3, 50 50, 3 100, 5 Z" />
                </svg>
            </div>

            <div class="layer-center z-5 pointer-events-none">
                <svg class="axes-svg w-full h-full" viewBox="0 0 200 200">
                    <path d="M 100, 12 Q 99, 70 100.5, 100 T 100, 188" />
                    <path d="M 12, 100 Q 70, 100.5 100, 99.5 T 188, 100" />
                </svg>
            </div>

            <div class="layer-center z-10 pointer-events-none">
                <div class="radar-sweep-beam" id="beamElement"></div>
            </div>

            <div data-quad="1-3" class="target-dot" style="top: 22%; left: 64%;"></div>
            <div data-quad="1-3" class="target-dot" style="top: 36%; left: 74%;"></div>
            <div data-quad="1-3" class="target-dot" style="top: 66%; left: 26%;"></div>
            <div data-quad="1-3" class="target-dot" style="top: 76%; left: 38%;"></div>
            
            <div data-quad="2-4" class="target-dot" style="top: 74%; left: 68%;"></div>
            <div data-quad="2-4" class="target-dot" style="top: 62%; left: 78%;"></div>
            <div data-quad="2-4" class="target-dot" style="top: 28%; left: 26%;"></div>
            <div data-quad="2-4" class="target-dot" style="top: 20%; left: 44%;"></div>

        </div>

        <div class="absolute bottom-[15px] left-[15px] right-[15px] h-[275px] bg-[#1C1C1E] rounded-[28px] border-none p-4 flex flex-col justify-between z-20 shadow-2xl overflow-hidden select-none">
            
            <div class="w-full bg-white/[0.04] rounded-full p-1 flex relative items-center h-11">
                <div id="chooser-bg" class="absolute inset-y-1 left-1 w-[calc(50%-4px)] bg-white/[0.09] backdrop-blur-xl rounded-full z-0 transition-transform duration-300 ease-[cubic-bezier(0.25,1,0.5,1)]"></div>
                
                <button onclick="switchTab('ships', this)" class="flex-1 h-full relative z-10 text-[13.5px] font-semibold tracking-tight text-white text-center">
                    Кораблики
                </button>
                <button onclick="switchTab('friends', this)" class="flex-1 h-full relative z-10 text-[13.5px] font-semibold tracking-tight text-white/30 text-center">
                    Друзья (0)
                </button>
            </div>

            <div class="flex-1 flex items-center justify-center px-2 py-2">
                <p class="text-[14px] leading-relaxed font-medium text-white/80 text-center">
                    Самое время поймать чей-нибудь кораблик! Сейчас в океане 
                    <span class="inline-flex items-center justify-center bg-white/20 text-white px-[6px] py-[1.5px] mx-[2px] rounded-full font-bold text-[13px] tracking-wide" style="transform: translateY(-0.5px);">999</span> 
                    дрейфующих бортов, какой достанешь ты?
                </p>
            </div>
            
            <button class="w-full py-3.5 px-6 rounded-full text-[15px] font-semibold tracking-wide transition-all active:scale-[0.98] bg-[#006DF9] text-white bg-[--tg-theme-button-color] text-[--tg-theme-button-text-color]">
                Поймать что-нибудь
            </button>
        </div>

    </main>

    <script>
        // Интеграция Telegram WebApp
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
            if (tg.requestFullscreen) tg.requestFullscreen();
            tg.setHeaderColor('#000000');
            tg.setBackgroundColor('#000000');
        }

        // Логика кастомного Choose-bar
        function switchTab(tab, btn) {
            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
            
            const bg = document.getElementById('chooser-bg');
            const buttons = btn.parentNode.querySelectorAll('button');
            
            buttons.forEach(b => {
                b.classList.remove('text-white');
                b.classList.add('text-white/30');
            });
            
            btn.classList.remove('text-white/30');
            btn.classList.add('text-white');
            
            if (tab === 'ships') {
                bg.style.transform = 'translateX(0%)';
            } else {
                const containerWidth = btn.parentNode.offsetWidth;
                const offset = (containerWidth / 2) - 6;
                bg.style.transform = `translateX(${offset}px)`;
            }
        }

        // Селекторы для поочередных групп точек
        const group13 = document.querySelectorAll('[data-quad="1-3"]');
        const group24 = document.querySelectorAll('[data-quad="2-4"]');

        const animationDuration = 4000; // 4 секунды круг
        const startTime = performance.now();

        function radarScannerLoop(timestamp) {
            const elapsed = (timestamp - startTime) % animationDuration;
            const angle = (elapsed / animationDuration) * 360;

            // Логика: делим круг на 2 основные фазы прохода осей радара
            const isPhase13 = (angle >= 0 && angle < 90) || (angle >= 180 && angle < 270);

            if (isPhase13) {
                // Плавно зажигаем 1-3 четверти
                group13.forEach(dot => dot.classList.add('active'));
                // Плавно растворяем в темноте 2-4 четверти
                group24.forEach(dot => dot.classList.remove('active'));
            } else {
                // Плавно зажигаем 2-4 четверти
                group24.forEach(dot => dot.classList.add('active'));
                // Плавно растворяем в темноте 1-3 четверти
                group13.forEach(dot => dot.classList.remove('active'));
            }

            requestAnimationFrame(radarScannerLoop);
        }

        // Плавный запуск сканирования
        requestAnimationFrame(radarScannerLoop);
    </script>
</body>
</html>
