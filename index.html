<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>СамоСобой</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif !important;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-user-select: none;
        }

        /* ЗАГОЛОВОК: Выровнен строго по оси Y с нативными кнопками Telegram */
        header {
            position: absolute;
            top: var(--tg-safe-area-inset-top, env(safe-area-inset-top, 0px));
            left: 0;
            right: 0;
            height: 44px; 
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            pointer-events: none;
        }

        /* ГЛАВНЫЙ КОНТЕЙНЕР (Базовый размер 75vw) */
        .radar-container {
            position: absolute;
            top: 50%; /* Вернули в центр */
            left: 50%;
            transform: translate(-50%, -50%);
            width: 75vw;
            max-width: 320px;
            aspect-ratio: 1 / 1;
        }

        /* БАЗОВЫЙ КЛАСС ДЛЯ ЦЕНТРИРОВАНИЯ И ВРАЩЕНИЯ СЛОЕВ */
        .layer-absolute {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transform-origin: center;
            overflow: visible;
        }

        /* --- ВОЛНОВЫЕ КРУГИ --- */
        /* Первый круг (Планета) */
        .circle-layer-1 {
            width: 100%; height: 100%;
            fill: #004080; /* Темно-синий, космос/океан */
            opacity: 0.9;
            z-index: 1;
            animation: rotateCounter 25s linear infinite;
        }
        /* Материки (Зеленые) */
        .circle-layer-1-continents {
            width: 100%; height: 100%;
            fill: #4CAF50; /* Зеленый материк */
            opacity: 0.7;
            z-index: 2; /* Над планетой */
            animation: rotateCounter 25s linear infinite; /* Та же анимация */
        }
        /* Второй круг (Пропорционально крупнее) */
        .circle-layer-2 {
            width: 120%; height: 120%; /* Крупнее, чем сейчас 114% */
            fill: #006DF9; opacity: 0.35;
            z-index: 1;
            animation: rotateClock 18s linear infinite;
        }
        /* Третий круг (Самый крупный) */
        .circle-layer-3 {
            width: 130%; height: 130%; /* Крупнее, чем сейчас 128% */
            fill: #006DF9; opacity: 0.15;
            z-index: 1;
            animation: rotateCounter 30s linear infinite;
        }

        /* --- СЕТКА РАДАРА (Светло-синий цвет, более прозрачный) --- */
        .radar-grid {
            width: 100%; height: 100%;
            z-index: 2;
            pointer-events: none;
            /* Искажение материков и сетки точь-в-точь как у первого круга */
            animation: rotateCounter 25s linear infinite;
        }
        .radar-grid path {
            fill: none;
            stroke: rgba(215, 235, 255, 0.15); /* Сине-белый и более прозрачный */
            stroke-width: 1.2;
        }
        .radar-grid line {
            stroke: rgba(215, 235, 255, 0.1);
            stroke-width: 1;
        }

        /* --- ВРАЩАЮЩИЙСЯ ЛУЧ (Сине-белый фейд) --- */
        .radar-sweep-box {
            width: 100%; height: 100%;
            z-index: 3;
            pointer-events: none;
            animation: sweepRotate 4s linear infinite;
        }

        /* --- ЛОТТИ КИТ (Тайминги) --- */
        .lottie-whale-box {
            width: 65%; /* Крупный, но не выходит за рамки */
            height: 65%;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            animation: whaleFading 5s ease-in-out infinite;
        }

        @keyframes whaleFading {
            0% { opacity: 0; }
            10% { opacity: 1; }  /* Быстрое появление за 0.5 сек (10% от 5 сек) */
            70% { opacity: 1; }  /* Держится видимым 3 секунды (до 70%) */
            80% { opacity: 0; }  /* Быстро исчезает за 0.5 сек (до 80%) */
            100% { opacity: 0; } /* Остаток цикла спит в темноте */
        }

        @keyframes rotateClock {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
        @keyframes rotateCounter {
            0% { transform: translate(-50%, -50%) rotate(360deg); }
            100% { transform: translate(-50%, -50%) rotate(0deg); }
        }
        @keyframes sweepRotate {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
    </style>
</head>
<body>

    <header>
        <div class="flex items-center space-x-2.5">
            <img 
                src="public/icons/logo.png" 
                alt="Логотип" 
                class="w-5 h-5 object-contain"
                onerror="this.style.display='none'"
            />
            <h1 class="text-base font-semibold tracking-tight text-white uppercase">
                СамоСобой
            </h1>
        </div>
    </header>

    <div class="radar-container">
        
        <svg class="layer-absolute circle-layer-3" viewBox="0 0 200 200">
            <path d="M 100, 2 C 140, 10 180, 25 198, 90 C 215, 155 150, 195 100, 198 C 50, 201 -5, 150 2, 90 C 10, 30 60, -5 100, 2 Z" />
        </svg>

        <svg class="layer-absolute circle-layer-2" viewBox="0 0 200 200">
            <path d="M 100, 5 C 135, 2 190, 30 195, 100 C 200, 170 145, 198 100, 195 C 55, 192 2, 160 5, 100 C 8, 40 65, 8 100, 5 Z" />
        </svg>

        <svg class="layer-absolute circle-layer-1" viewBox="0 0 200 200">
            <path d="M 100, 5 C 150, 7 193, 50 195, 100 C 197, 150 150, 193 100, 195 C 50, 197 7, 150 5, 100 C 3, 50 50, 3 100, 5 Z" />
        </svg>

        <svg class="layer-absolute circle-layer-1-continents" viewBox="0 0 200 200">
            <path d="M 100, 15 C 120, 12 140, 25 145, 45 C 150, 65 130, 85 110, 80 C 90, 75 75, 55 80, 35 C 85, 15 100, 12 Z" />
            <path d="M 100, 85 C 115, 82 135, 95 140, 115 C 145, 135 125, 155 105, 150 C 85, 145 70, 125 75, 105 C 80, 85 100, 82 Z" />
            <path d="M 50, 60 C 60, 58 70, 65 72, 75 C 74, 85 64, 95 54, 92 C 44, 89 39, 79 41, 69 C 43, 59 50, 58 Z" />
            <path d="M 150, 60 C 160, 58 170, 65 172, 75 C 174, 85 164, 95 154, 92 C 144, 89 139, 79 141, 69 C 143, 59 150, 58 Z" />
        </svg>

        <svg class="layer-absolute radar-grid" viewBox="0 0 200 200">
            <path d="M 100, 5 C 150, 7 193, 50 195, 100 C 197, 150 150, 193 100, 195 C 50, 197 7, 150 5, 100 C 3, 50 50, 3 100, 5 Z" />
            
            <path d="M 100, 35 C 135, 36 165, 65 166, 100 C 167, 135 135, 165 100, 166 C 65, 167 34, 135 35, 100 C 36, 65 65, 34 100, 35 Z" stroke-dasharray="4 4" />
            
            <path d="M 100, 65 C 118, 65 137, 82 138, 100 C 139, 118 118, 137 100, 138 C 82, 139 62, 118 63, 100 C 64, 82 82, 64 100, 65 Z" />
            
            <path d="M 100, 12 Q 99, 70 100.5, 100 T 100, 188" />
            <path d="M 12, 100 Q 70, 100.5 100, 99.5 T 188, 100" />
        </svg>

        <svg class="layer-absolute radar-sweep-box" viewBox="0 0 200 200">
            <defs>
                <clipPath id="radarClip">
                    <path d="M 100, 5 C 150, 7 193, 50 195, 100 C 197, 150 150, 193 100, 195 C 50, 197 7, 150 5, 100 C 3, 50 50, 3 100, 5 Z" />
                </clipPath>
            </defs>
            <g clip-path="url(#radarClip)">
                <foreignObject x="0" y="0" width="200" height="200">
                    <div xmlns="http://www.w3.org/1999/xhtml" style="width:100%; height:100%; border-radius:50%; background: conic-gradient(from 0deg, transparent 65%, rgba(215, 235, 255, 0.15) 96%, rgba(200, 230, 255, 0.95) 100%); width:100%; height:100%;"></div>
                </foreignObject>
            </g>
        </svg>

        <div class="layer-absolute lottie-whale-box">
            <lottie-player 
                src="public/gifs/whale.json" 
                background="transparent" 
                speed="1" 
                loop 
                autoplay
                style="width: 100%; height: 100%;">
            </lottie-player>
        </div>

    </div>

    <div class="w-full text-center mt-glass py-6 px-12 z-20" style="position: absolute; top: calc(50% + 200px); left: 50%; transform: translateX(-50%);">
        <p class="text-sm font-medium leading-relaxed" style="opacity: 0.85;">
            Самое время поймать чей-нибудь кораблик! Сейчас в океане 999 дрейфующих бортов, какой достанешь ты?
        </p>
    </div>

    <div class="fixed bottom-glass left-glass right-glass z-20">
        <button class="w-full p-4 rounded-xl text-lg font-bold bg-[#006DF9] text-white bg-[--tg-theme-button-color] text-[--tg-theme-button-text-color]">
            Поймать что-нибудь
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        
        // Разворачиваем и запрашиваем FullScreen (для новых версий TWA)
        tg.expand();
        if (tg.requestFullscreen) {
            tg.requestFullscreen();
        }
        
        // Перекрашиваем верхний и нижний системные бары в черный
        tg.setHeaderColor('#000000');
        tg.setBackgroundColor('#000000');
    </script>
</body>
</html>
