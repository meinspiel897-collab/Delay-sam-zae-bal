<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>СамоСобой</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* Глубокий OLED черный фон */
        body {
            font-family: 'Inter', sans-serif !important;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Контейнер для центральных кругов-волн */
        .circle-wave-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85vw;
            max-width: 340px;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Базовый стиль для SVG слоев */
        .circle-wave-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-origin: center;
        }

        /* Задний круг: акцентный 006DF9, чуть крупнее, прозрачнее, противоположное движение */
        .circle-back {
            width: 115%;
            height: 115%;
            fill: #006DF9;
            opacity: 0.12;
            animation: rotateClockwise 18s linear infinite, pulseSlow 5s ease-in-out infinite;
        }

        /* Передний круг: акцентный 006DF9, основной */
        .circle-front {
            fill: #006DF9;
            opacity: 0.25;
            animation: rotateCounterClockwise 12s linear infinite;
        }

        /* Анимации вращения */
        @keyframes rotateClockwise {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes rotateCounterClockwise {
            0% { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }

        /* Мягкое дыхание контура */
        @keyframes pulseSlow {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
</head>
<body>

    <!-- Заголовок в самом верху шапки (без экстремального вылета вверх) -->
    <header class="w-full flex justify-center pt-4 z-10">
        <div class="flex items-center space-x-2.5">
            <img 
                src="public/icons/logo.png" 
                alt="Логотип" 
                class="w-5 h-5 object-contain"
                onerror="this.style.display='none'"
            />
            <h1 class="text-base font-semibold tracking-tight text-white uppercase">
                СамоСобой
            </h1>
        </div>
    </header>

    <!-- Центрированный блок с волнообразными кругами -->
    <div class="circle-wave-container">
        <!-- Задний круг (8 выраженных изгибов контура) -->
        <svg class="circle-wave-layer circle-back" viewBox="0 0 200 200">
            <path d="M 100,10 
                     C 130,5  145,35 165,45 
                     C 185,55 195,80 190,110 
                     C 185,140 155,160 140,175 
                     C 125,190 85,195  65,180 
                     C 45,165 40,145  25,130 
                     C 10,115 5,85    15,65 
                     C 25,45  55,35    70,15 
                     C 80,5   85,12    100,10 Z" />
        </svg>

        <!-- Передний основной круг (альтернативные глубокие изгибы для интерференции) -->
        <svg class="circle-wave-layer circle-front" viewBox="0 0 200 200">
            <path d="M 100,18 
                     C 120,8  155,20  170,45 
                     C 185,70 192,95  182,120 
                     C 172,145 145,172 125,182 
                     C 105,192 75,185  55,170 
                     C 35,155 15,135  12,105 
                     C 10,75  30,50    48,32 
                     C 65,15  85,25    100,18 Z" />
        </svg>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        tg.setHeaderColor('#000000');
        tg.setBackgroundColor('#000000');
    </script>
</body>
</html>
