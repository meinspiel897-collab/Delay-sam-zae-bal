<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>СамоСобой</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif !important;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Шапка приложения */
        header {
            position: absolute;
            top: var(--tg-safe-area-inset-top, env(safe-area-inset-top, 0px));
            left: 0;
            right: 0;
            height: 44px; 
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            pointer-events: none;
        }

        /* Главный контейнер для позиционирования элементов */
        .main-layout {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 24px;
            box-sizing: border-box;
            margin-top: 40px; /* Сдвиг вниз от шапки */
        }

        /* Квадратная зона радара */
        .radar-container {
            position: relative;
            width: 60vw;
            height: 60vw; 
            max-width: 250px;
            max-height: 250px;
            aspect-ratio: 1 / 1;
            margin-bottom: 40px; /* Отступ до текста снизу */
        }

        /* Абсолютное центрирование внутренних слоев радара */
        .layer-absolute {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transform-origin: center;
            overflow: visible;
        }

        /* --- ВОЛНОВЫЕ КРУГИ БЭКГРАУНДА --- */
        .circle-layer-1 {
            width: 100%; height: 100%;
            fill: #006DF9; 
            opacity: 0.75; 
            z-index: 1;
            animation: rotateCounter 25s linear infinite;
        }
        .circle-layer-2 {
            width: 114%; height: 114%;
            fill: #006DF9; 
            opacity: 0.35; 
            z-index: 1;
            animation: rotateClock 18s linear infinite;
        }
        .circle-layer-3 {
            width: 125%; height: 125%; 
            fill: #006DF9; 
            opacity: 0.15; 
            z-index: 1;
            animation: rotateCounter 30s linear infinite;
        }

        /* --- ИМПУЛЬСНЫЕ КОЛЬЦА (Мягко тают без смещения центра) --- */
        .pulse-ring-container {
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }
        .pulse-ring-container path {
            fill: none;
            stroke: rgba(215, 235, 255, 0.4);
        }
        
        .ring-pulse-1 {
            animation: sonarFade1 3s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite;
        }
        .ring-pulse-2 {
            stroke-dasharray: 4 4;
            animation: sonarFade2 3s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite;
            animation-delay: 1.5s;
        }

        /* --- СТАТИЧНЫЙ СЛОЙ: Перекрестие (Не крутится) --- */
        .radar-lines-static {
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
        }
        .radar-lines-static path {
            fill: none;
            stroke: rgba(215, 235, 255, 0.22);
            stroke-width: 1;
        }

        /* --- ВРАЩАЮЩИЙСЯ ЛУЧ (Конический шлейф) --- */
        .radar-sweep-solid {
            width: 98%; 
            height: 98%; 
            border-radius: 50%;
            background: conic-gradient(
                from 0deg, 
                transparent 40%, 
                rgba(0, 109, 249, 0.08) 75%,
                rgba(215, 235, 255, 0.22) 99.2%,
                rgba(215, 235, 255, 0.55) 100%
            );
            z-index: 4;
            pointer-events: none;
            animation: sweepRotate 4s linear infinite;
        }

        /* АНИМАЦИИ */
        @keyframes sonarFade1 {
            0% { stroke-width: 0; opacity: 0.9; }
            50% { opacity: 0.4; }
            100% { stroke-width: 35; opacity: 0; }
        }
        @keyframes sonarFade2 {
            0% { stroke-width: 0; opacity: 0.9; }
            50% { opacity: 0.4; }
            100% { stroke-width: 45; opacity: 0; }
        }
        @keyframes rotateClock {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
        @keyframes rotateCounter {
            0% { transform: translate(-50%, -50%) rotate(360deg); }
            100% { transform: translate(-50%, -50%) rotate(0deg); }
        }
        @keyframes sweepRotate {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Шапка приложения -->
    <header>
        <div class="flex items-center space-x-2.5">
            <img 
                src="public/icons/logo.png" 
                alt="Логотип" 
                class="w-5 h-5 object-contain"
                onerror="this.style.display='none'"
            />
            <h1 class="text-base font-semibold tracking-tight text-white">
                СамоСобой
            </h1>
        </div>
    </header>

    <!-- Главная рабочая область экрана -->
    <div class="main-layout">
        
        <!-- Контейнер Радара -->
        <div class="radar-container">
            
            <!-- Слой 3 (Задний фон: Увеличенный ореол) -->
            <svg class="layer-absolute circle-layer-3" viewBox="0 0 200 200">
                <path d="M 100, 2 C 140, 10 180, 25 198, 90 C 215, 155 150, 195 100, 198 C 50, 201 -5, 150 2, 90 C 10, 30 60, -5 100, 2 Z" />
            </svg>

            <!-- Слой 2 (Средний) -->
            <svg class="layer-absolute circle-layer-2" viewBox="0 0 200 200">
                <path d="M 100, 5 C 135, 2 190, 30 195, 100 C 200, 170 145, 198 100, 195 C 55, 192 2, 160 5, 100 C 8, 40 65, 8 100, 5 Z" />
            </svg>

            <!-- Слой 1 (Передний основной круг) -->
            <svg class="layer-absolute circle-layer-1" viewBox="0 0 200 200">
                <path d="M 100, 5 C 150, 7 193, 50 195, 100 C 197, 150 150, 193 100, 195 C 50, 197 7, 150 5, 100 C 3, 50 50, 3 100, 5 Z" />
            </svg>

            <!-- ДИНАМИЧЕСКИЙ СЛОЙ: Кольца появляются и тают идеально из центра первого круга -->
            <svg class="layer-absolute pulse-ring-container" viewBox="0 0 200 200">
                <!-- Импульс 1: Сплошной -->
                <path class="ring-pulse-1" d="M 100, 5 C 150, 7 193, 50 195, 100 C 197, 150 150, 193 100, 195 C 50, 197 7, 150 5, 100 C 3, 50 50, 3 100, 5 Z" />
                <!-- Импульс 2: Пунктирный -->
                <path class="ring-pulse-2" d="M 100, 5 C 150, 7 193, 50 195, 100 C 197, 150 150, 193 100, 195 C 50, 197 7, 150 5, 100 C 3, 50 50, 3 100, 5 Z" />
            </svg>

            <!-- СТАТИЧНЫЙ СЛОЙ: Перекрестие (С микро-искажениями по кривой Безье) -->
            <svg class="layer-absolute radar-lines-static" viewBox="0 0 200 200">
                <path d="M 100, 12 Q 99, 70 100.5, 100 T 100, 188" />
                <path d="M 12, 100 Q 70, 100.5 100, 99.5 T 188, 100" />
            </svg>

            <!-- ВРАЩАЮЩИЙСЯ ЛУЧ: Конический градиентный хвост -->
            <div class="layer-absolute radar-sweep-solid"></div>

        </div>

        <!-- Текстовый блок под радаром -->
        <p class="text-center text-sm font-normal leading-relaxed tracking-tight max-w-[280px]" style="color: rgba(255, 255, 255, 0.85);">
            «Самое время поймать чей-нибудь кораблик! Сейчас в океане 999 дрейфующих бортов, какой достанешь ты?»
        </p>

        <!-- Акцентная прямоугольная кнопка с круглыми углами по ширине текста -->
        <button class="mt-6 w-full max-w-[280px] bg-[#006DF9] active:bg-[#0056c6] text-white text-sm font-semibold py-3 px-6 rounded-full transition-colors duration-150 shadow-lg shadow-[#006DF9]/20">
            Поймать что-нибудь
        </button>

    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        
        tg.expand();
        if (tg.requestFullscreen) {
            tg.requestFullscreen();
        }
        
        tg.setHeaderColor('#000000');
        tg.setBackgroundColor('#000000');
    </script>
</body>
</html>
