<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>СамоСобой</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif !important;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Заголовок выровнен по интерфейсу Telegram */
        header {
            position: absolute;
            top: var(--tg-safe-area-inset-top, env(safe-area-inset-top, 0px));
            left: 0;
            right: 0;
            height: 44px; 
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            pointer-events: none;
        }

        /* Главный квадратный контейнер */
        .radar-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60vw;
            height: 60vw; 
            max-width: 260px;
            max-height: 260px;
            aspect-ratio: 1 / 1;
        }

        /* Абсолютное центрирование слоев */
        .layer-absolute {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transform-origin: center;
            overflow: visible;
        }

        /* --- ВОЛНОВЫЕ КРУГИ БЭКГРАУНДА --- */
        .circle-layer-1 {
            width: 100%; height: 100%;
            fill: #006DF9; 
            opacity: 0.75; 
            z-index: 1;
            animation: rotateCounter 25s linear infinite;
        }
        .circle-layer-2 {
            width: 114%; height: 114%;
            fill: #006DF9; 
            opacity: 0.35; 
            z-index: 1;
            animation: rotateClock 18s linear infinite;
        }
        .circle-layer-3 {
            width: 125%; height: 125%; 
            fill: #006DF9; 
            opacity: 0.15; 
            z-index: 1;
            animation: rotateCounter 30s linear infinite;
        }

        /* --- ВНЕШНИЙ КОНТУР РАДАРА (Вращается стабильно) --- */
        .radar-outer-moving {
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            animation: rotateCounter 25s linear infinite; 
        }
        .radar-outer-moving path {
            fill: none;
            stroke: rgba(215, 235, 255, 0.32); 
            stroke-width: 1.2;
        }

        /* --- ДИНАМИЧЕСКИЕ ИМПУЛЬСНЫЕ КОЛЬЦА (Разлетаются из центра) --- */
        .pulse-ring-wrapper {
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }
        .pulse-ring-wrapper path {
            fill: none;
            stroke: rgba(215, 235, 255, 0.35);
            transform-origin: center;
        }
        
        /* Первое импульсное кольцо (сплошное) */
        .ring-pulse-1 {
            stroke-width: 1.2;
            animation: sonarPing 3.2s cubic-bezier(0.215, 0.610, 0.355, 1) infinite;
        }
        /* Второе импульсное кольцо (пунктирное, летит следом) */
        .ring-pulse-2 {
            stroke-width: 1;
            stroke-dasharray: 4 4;
            animation: sonarPing 3.2s cubic-bezier(0.215, 0.610, 0.355, 1) infinite;
            animation-delay: 1.6s;
        }

        /* --- СТАТИЧНЫЙ КРЕСТ --- */
        .radar-lines-static {
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
        }
        .radar-lines-static path {
            fill: none;
            stroke: rgba(215, 235, 255, 0.22);
            stroke-width: 1;
        }

        /* --- ВРАЩАЮЩИЙСЯ ЛУЧ И ИСЧЕЗАЮЩИЙ ХВОСТ --- */
        .radar-sweep-container {
            width: 100%;
            height: 100%;
            z-index: 4;
            pointer-events: none;
            animation: sweepRotate 4s linear infinite;
        }

        /* Свечение следа (конический шлейф, уходящий в альфу) */
        .sweep-fade-tail {
            width: 96%; height: 96%;
            border-radius: 50%;
            position: absolute;
            top: 2%; left: 2%;
            background: conic-gradient(
                from -40deg,
                rgba(0, 109, 249, 0) 0%,
                rgba(0, 109, 249, 0.15) 60%,
                rgba(215, 235, 255, 0.25) 100%
            );
            mask: url(#radarMask);
            -webkit-mask: url(#radarMask);
            pointer-events: none;
        }

        /* Тонкая живая линия самого сканера */
        .radar-sweep-container path.sweep-line {
            fill: none;
            stroke: rgba(215, 235, 255, 0.45);
            stroke-width: 1.4;
        }

        /* АНИМАЦИИ */
        @keyframes sonarPing {
            0% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 0.9;
            }
            80% {
                opacity: 0.4;
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0;
            }
        }
        @keyframes rotateClock {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
        @keyframes rotateCounter {
            0% { transform: translate(-50%, -50%) rotate(360deg); }
            100% { transform: translate(-50%, -50%) rotate(0deg); }
        }
        @keyframes sweepRotate {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Шапка приложения -->
    <header>
        <div class="flex items-center space-x-2.5">
            <img 
                src="public/icons/logo.png" 
                alt="Логотип" 
                class="w-5 h-5 object-contain"
                onerror="this.style.display='none'"
            />
            <h1 class="text-base font-semibold tracking-tight text-white">
                СамоСобой
            </h1>
        </div>
    </header>

    <!-- Главная рабочая зона радара -->
    <div class="radar-container">
        
        <!-- Слой 3 (Задний фон: Ореол) -->
        <svg class="layer-absolute circle-layer-3" viewBox="0 0 200 200">
            <path d="M 100, 2 C 140, 10 180, 25 198, 90 C 215, 155 150, 195 100, 198 C 50, 201 -5, 150 2, 90 C 10, 30 60, -5 100, 2 Z" />
        </svg>

        <!-- Слой 2 (Средний) -->
        <svg class="layer-absolute circle-layer-2" viewBox="0 0 200 200">
            <path d="M 100, 5 C 135, 2 190, 30 195, 100 C 200, 170 145, 198 100, 195 C 55, 192 2, 160 5, 100 C 8, 40 65, 8 100, 5 Z" />
        </svg>

        <!-- Слой 1 (Передний основной круг) -->
        <svg class="layer-absolute circle-layer-1" viewBox="0 0 200 200">
            <path d="M 100, 5 C 150, 7 193, 50 195, 100 C 197, 150 150, 193 100, 195 C 50, 197 7, 150 5, 100 C 3, 50 50, 3 100, 5 Z" />
        </svg>

        <!-- ФИКСИРОВАННЫЙ СЛОЙ: Внешний искаженный контур радара (Белый 0.32) -->
        <svg class="layer-absolute radar-outer-moving" viewBox="0 0 200 200">
            <path d="M 100, 5 C 150, 7 193, 50 195, 100 C 197, 150 150, 193 100, 195 C 50, 197 7, 150 5, 100 C 3, 50 50, 3 100, 5 Z" />
        </svg>

        <!-- ДИНАМИЧЕСКИЙ СЛОЙ: Кольца, разлетающиеся из центра и исчезающие -->
        <svg class="layer-absolute pulse-ring-wrapper" viewBox="0 0 200 200">
            <!-- Кольцо 1: Повторяет форму основного искажения при расширении -->
            <path class="layer-absolute ring-pulse-1" d="M 100, 5 C 150, 7 193, 50 195, 100 C 197, 150 150, 193 100, 195 C 50, 197 7, 150 5, 100 C 3, 50 50, 3 100, 5 Z" />
            <!-- Кольцо 2: Пунктирное, идет внахлест -->
            <path class="layer-absolute ring-pulse-2" d="M 100, 5 C 150, 7 193, 50 195, 100 C 197, 150 150, 193 100, 195 C 50, 197 7, 150 5, 100 C 3, 50 50, 3 100, 5 Z" />
        </svg>

        <!-- СТАТИЧНЫЙ СЛОЙ: Перекрестие (С легким изгибом, не вращается) -->
        <svg class="layer-absolute radar-lines-static" viewBox="0 0 200 200">
            <path d="M 100, 12 Q 99, 70 100.5, 100 T 100, 188" />
            <path d="M 12, 100 Q 70, 100.5 100, 99.5 T 188, 100" />
        </svg>

        <!-- ДИНАМИЧЕСКИЙ СЛОЙ: Сканирующий луч и честный исчезающий фейд-след -->
        <div class="layer-absolute radar-sweep-container">
            <!-- Объёмный затухающий хвост -->
            <div class="sweep-fade-tail"></div>
            
            <!-- Тонкая, аккуратно анимированная нить прибора -->
            <svg class="w-full h-full" viewBox="0 0 200 200" style="position: absolute; top: 0; left: 0;">
                <path class="sweep-line" d="M 100, 100 Q 102, 50 100, 5">
                    <animate 
                        attributeName="d" 
                        dur="3.5s" 
                        repeatCount="indefinite"
                        values="M 100, 100 Q 102, 50 100, 5; 
                                M 100, 100 Q 99, 50 100, 5; 
                                M 100, 100 Q 104, 50 100, 5; 
                                M 100, 100 Q 102, 50 100, 5" 
                    />
                </path>
            </svg>
        </div>

    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        
        tg.expand();
        if (tg.requestFullscreen) {
            tg.requestFullscreen();
        }
        
        tg.setHeaderColor('#000000');
        tg.setBackgroundColor('#000000');
    </script>
</body>
</html>
