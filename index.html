<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>СамоСобой</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* Глубокий OLED черный фон */
        body {
            font-family: 'Inter', sans-serif !important;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Контейнер для центральных волновых кругов (компактный размер) */
        .circle-wave-container {
            position: absolute;
            top: 53%; /* Чуть сместили вниз с учетом аккуратной шапки */
            left: 50%;
            transform: translate(-50%, -50%);
            width: 65vw; /* Уменьшили размер, чтобы они смотрелись аккуратнее */
            max-width: 260px;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .circle-wave-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-origin: center;
        }

        /* Задний круг: акцентный, крупнее, прозрачнее, вращается по часовой */
        .circle-back {
            width: 114%;
            height: 114%;
            fill: #006DF9;
            opacity: 0.12; /* Чуть подняли видимость, так как цветной слой мягче белого */
            animation: rotateClockwise 18s linear infinite, pulseMild 5s ease-in-out infinite;
        }

        /* Передний круг: основной акцентный 006DF9, вращается против часовой */
        .circle-front {
            fill: #006DF9;
            opacity: 0.25;
            animation: rotateCounterClockwise 12s linear infinite;
        }

        /* Анимации вращения */
        @keyframes rotateClockwise {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes rotateCounterClockwise {
            0% { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }

        /* Легкое органическое дыхание */
        @keyframes pulseMild {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }
    </style>
</head>
<body>

    <!-- Шапка: теперь просто аккуратно сверху экрана, без экстремальных вылетов -->
    <header class="w-full flex justify-center pt-4 z-10">
        <div class="flex items-center space-x-2.5">
            <img 
                src="public/icons/logo.png" 
                alt="Логотип" 
                class="w-5 h-5 object-contain"
                onerror="this.style.display='none'"
            />
            <h1 class="text-base font-semibold tracking-tight text-white uppercase">
                СамоСобой
            </h1>
        </div>
    </header>

    <!-- Центрированные волновые круги -->
    <div class="circle-wave-container">
        <!-- Задний круг (Множество мелких выступающих изгибов, более округлый формат) -->
        <svg class="circle-wave-layer circle-back" viewBox="0 0 200 200">
            <path d="M 100, 12 
                     C 125, 10  140, 28  155, 35 
                     C 170, 42  192, 55  188, 80 
                     C 184, 105 190, 130 175, 148 
                     C 160, 166 135, 184 110, 188
                     C 85,  192 60,  175 45,  165
                     C 30,  155 10,  135 12,  110
                     C 14,  85  10,  60  28,  42
                     C 46,  24  75,  14  100, 12 Z" />
        </svg>

        <!-- Передний круг (Собственная карта выступов для асинхронного наложения) -->
        <svg class="circle-wave-layer circle-front" viewBox="0 0 200 200">
            <path d="M 100, 16 
                     C 130, 14  145, 22  162, 40 
                     C 179, 58  184, 85  184, 105 
                     C 184, 125 174, 148 158, 162 
                     C 142, 176 120, 184 100, 184
                     C 80,  184 55,  178 40,  162
                     C 25,  146 16,  125 16,  105
                     C 16,  85  22,  55  40,  38
                     C 58,  21  70,  18  100, 16 Z" />
        </svg>
    </div>

    <!-- Нижние волны временно убраны (закомментированы), но сохранены в структуре -->
    <!-- 
    <div class="wave-container">
        <svg class="wave-layer wave-back" viewBox="0 0 1200 120" preserveAspectRatio="none">
            <path d="M0,80 C150,110 350,50 500,80 C650,110 850,50 1000,80 C1150,110 1350,50 1500,80 L1500,120 L0,120 Z"></path>
        </svg>
        <svg class="wave-layer wave-front" viewBox="0 0 1200 120" preserveAspectRatio="none">
            <path d="M0,70 C150,40 350,100 500,70 C650,40 850,100 1000,70 C1150,40 1350,100 1500,70 L1500,120 L0,120 Z"></path>
        </svg>
    </div> 
    -->

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        tg.setHeaderColor('#000000');
        tg.setBackgroundColor('#000000');
    </script>
</body>
</html>
