<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>СамоСобой</title>
    <!-- Подключаем Telegram WebApp JS SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Премиальный шрифт Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            background-color: #000000; /* Глубокий черный фон Apple */
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }

        /* Анимация плавного смещения волн по горизонтали */
        @keyframes waveLeft {
            0% { transform: translateX(0); }
            50% { transform: translateX(-25%); }
            100% { transform: translateX(0); }
        }
        @keyframes waveRight {
            0% { transform: translateX(-50%); }
            50% { transform: translateX(-25%); }
            100% { transform: translateX(-50%); }
        }

        .wave-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100px; /* Умеренно низкая высота волн */
            overflow: hidden;
            pointer-events: none;
        }

        .wave-layer {
            position: absolute;
            bottom: 0;
            width: 200%;
            height: 100%;
        }

        /* Задний слой (более прозрачный и еще более медленный) */
        .wave-back {
            fill: #ffffff;
            opacity: 0.03;
            animation: waveRight 24s ease-in-out infinite;
        }

        /* Передний слой (чуть более контрастный) */
        .wave-front {
            fill: #ffffff;
            opacity: 0.07;
            animation: waveLeft 18s ease-in-out infinite;
        }
    </style>
</head>
<body class="h-screen w-full flex flex-col justify-between items-center relative overflow-hidden">
    
    <!-- ЗАГЛОВАК В ЦЕНТРЕ ПО ОСИ ИКС В САМОМ ВЕРХУ -->
    <header class="w-full text-center pt-8 z-10 shrink-0">
        <span class="text-sm font-bold uppercase tracking-[0.3em] text-white">
            СамоСобой
        </span>
    </header>

    <!-- СВОБОДНАЯ ЦЕНТРАЛЬНАЯ ЧАСТЬ (Пустота для чистоты дизайна) -->
    <div class="flex-grow"></div>

    <!-- МЕДЛЕННЫЕ ДВУХСЛОЙНЫЕ ВОЛНЫ ВНИЗУ -->
    <div class="wave-container z-0">
        <!-- Задний слой (более прозрачный) -->
        <svg class="wave-layer wave-back" viewBox="0 0 1200 120" preserveAspectRatio="none">
            <path d="M0,80 C150,110 350,50 500,80 C650,110 850,50 1000,80 C1150,110 1350,50 1500,80 L1500,120 L0,120 Z"></path>
        </svg>
        
        <!-- Передний слой -->
        <svg class="wave-layer wave-front" viewBox="0 0 1200 120" preserveAspectRatio="none">
            <path d="M0,70 C150,40 350,100 500,70 C650,40 850,100 1000,70 C1150,40 1350,100 1500,70 L1500,120 L0,120 Z"></path>
        </svg>
    </div>

    <script>
        // Инициализируем Telegram WebApp
        const tg = window.Telegram.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
            // Настраиваем цвета системного интерфейса Telegram
            tg.setHeaderColor('#000000');
            tg.setBackgroundColor('#000000');
        }
    </script>
</body>
</html>
