<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>СамоСобой</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* Глубокий OLED черный фон */
        body {
            font-family: 'Inter', sans-serif !important;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Анимации волн */
        @keyframes waveLeft {
            0% { transform: translateX(0); }
            50% { transform: translateX(-35%); }
            100% { transform: translateX(0); }
        }
        @keyframes waveRight {
            0% { transform: translateX(-50%); }
            50% { transform: translateX(-15%); }
            100% { transform: translateX(-50%); }
        }

        .wave-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 120px;
            pointer-events: none;
        }

        .wave-layer {
            position: absolute;
            bottom: 0;
            width: 200%;
            height: 100%;
        }

        .wave-back {
            fill: #ffffff;
            opacity: 0.02;
            animation: waveMoveRight 30s ease-in-out infinite;
        }

        .wave-front {
            fill: #ffffff;
            opacity: 0.04;
            animation: waveMoveLeft 24s ease-in-out infinite;
        }

        @keyframes waveMoveLeft {
            0% { transform: translateX(0); }
            50% { transform: translateX(-30%); }
            100% { transform: translateX(0); }
        }
        @keyframes waveMoveRight {
            0% { transform: translateX(-50%); }
            50% { transform: translateX(-20%); }
            100% { transform: translateX(-50%); }
        }
    </style>
</head>
<body>

    <!-- Заголовок в самом верху -->
    <header class="w-full flex justify-center pt-8 z-10">
        <div class="flex items-center space-x-2.5">
            <!-- Логотип слева -->
            <img 
                src="public/icons/logo.png" 
                alt="Логотип" 
                class="w-5 h-5 object-contain"
                onerror="this.style.display='none'"
            />
            <!-- Заголовок с плотным трекингом -->
            <h1 class="text-base font-semibold tracking-tight text-white uppercase">
                СамоСобой
            </h1>
        </div>
    </header>

    <!-- Океанский слой волн -->
    <div class="wave-container">
        <svg class="wave-layer wave-back" viewBox="0 0 1200 120" preserveAspectRatio="none">
            <path d="M0,80 C150,110 350,50 500,80 C650,110 850,50 1000,80 C1150,110 1350,50 1500,80 L1500,120 L0,120 Z"></path>
        </svg>
        <svg class="wave-layer wave-front" viewBox="0 0 1200 120" preserveAspectRatio="none">
            <path d="M0,70 C150,40 350,100 500,70 C650,40 850,100 1000,70 C1150,40 1350,100 1500,70 L1500,120 L0,120 Z"></path>
        </svg>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        tg.setHeaderColor('#000000');
        tg.setBackgroundColor('#000000');
    </script>
</body>
</html>
