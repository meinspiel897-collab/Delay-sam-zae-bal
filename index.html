<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>СамоСобой</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif !important;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Заголовок выровнен по оси Y с элементами интерфейса Telegram FullScreen */
        header {
            position: absolute;
            top: var(--tg-safe-area-inset-top, env(safe-area-inset-top, 0px));
            left: 0;
            right: 0;
            height: 44px; 
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            pointer-events: none;
        }

        /* Главный квадратный контейнер */
        .radar-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60vw;
            height: 60vw; 
            max-width: 260px;
            max-height: 260px;
            aspect-ratio: 1 / 1;
        }

        /* Абсолютное центрирование слоев */
        .layer-absolute {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transform-origin: center;
            overflow: visible;
        }

        /* --- ВОЛНОВЫЕ КРУГИ БЭКГРАУНДА --- */
        .circle-layer-1 {
            width: 100%; height: 100%;
            fill: #006DF9; 
            opacity: 0.75; 
            z-index: 1;
            animation: rotateCounter 25s linear infinite;
        }
        .circle-layer-2 {
            width: 114%; height: 114%;
            fill: #006DF9; 
            opacity: 0.35; 
            z-index: 1;
            animation: rotateClock 18s linear infinite;
        }
        .circle-layer-3 {
            width: 125%; height: 125%; 
            fill: #006DF9; 
            opacity: 0.15; 
            z-index: 1;
            animation: rotateCounter 30s linear infinite;
        }

        /* --- ДИНАМИЧЕСКИЕ ОКРУЖНОСТИ РАДАРА (Вращаются) --- */
        .radar-circles-moving {
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            animation: rotateCounter 25s linear infinite; 
        }

        .radar-circles-moving path {
            fill: none;
            stroke: rgba(215, 235, 255, 0.32); 
            stroke-width: 1.2;
        }

        /* --- СТАТИЧНЫЙ КРЕСТ --- */
        .radar-lines-static {
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
        }

        .radar-lines-static path {
            fill: none;
            stroke: rgba(215, 235, 255, 0.22);
            stroke-width: 1;
        }

        /* --- ВРАЩАЮЩИЙСЯ КОНТЕЙНЕР ЛУЧА --- */
        .radar-sweep-container {
            width: 100%;
            height: 100%;
            z-index: 4;
            pointer-events: none;
            animation: sweepRotate 4s linear infinite;
        }

        .radar-sweep-container path.sweep-line {
            fill: none;
            stroke: rgba(215, 235, 255, 0.45);
            stroke-width: 1.3;
        }

        .radar-sweep-container path.sweep-glow {
            fill: url(#sweepGradient);
            opacity: 0.22;
        }

        /* АНИМАЦИИ ВРАЩЕНИЯ */
        @keyframes rotateClock {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
        @keyframes rotateCounter {
            0% { transform: translate(-50%, -50%) rotate(360deg); }
            100% { transform: translate(-50%, -50%) rotate(0deg); }
        }
        @keyframes sweepRotate {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Шапка приложения -->
    <header>
        <div class="flex items-center space-x-2.5">
            <img 
                src="public/icons/logo.png" 
                alt="Логотип" 
                class="w-5 h-5 object-contain"
                onerror="this.style.display='none'"
            />
            <h1 class="text-base font-semibold tracking-tight text-white">
                СамоСобой
            </h1>
        </div>
    </header>

    <!-- Главная рабочая зона радара -->
    <div class="radar-container">
        
        <!-- Слой 3 (Задний фон: Ореол) -->
        <svg class="layer-absolute circle-layer-3" viewBox="0 0 200 200">
            <path d="M 100, 2 C 140, 10 180, 25 198, 90 C 215, 155 150, 195 100, 198 C 50, 201 -5, 150 2, 90 C 10, 30 60, -5 100, 2 Z" />
        </svg>

        <!-- Слой 2 (Средний) -->
        <svg class="layer-absolute circle-layer-2" viewBox="0 0 200 200">
            <path d="M 100, 5 C 135, 2 190, 30 195, 100 C 200, 170 145, 198 100, 195 C 55, 192 2, 160 5, 100 C 8, 40 65, 8 100, 5 Z" />
        </svg>

        <!-- Слой 1 (Передний основной круг) -->
        <svg class="layer-absolute circle-layer-1" viewBox="0 0 200 200">
            <path d="M 100, 5 C 150, 7 193, 50 195, 100 C 197, 150 150, 193 100, 195 C 50, 197 7, 150 5, 100 C 3, 50 50, 3 100, 5 Z" />
        </svg>

        <!-- ПОДВИЖНЫЙ СЛОЙ: Искаженные окружности радара -->
        <svg class="layer-absolute radar-circles-moving" viewBox="0 0 200 200">
            <path d="M 100, 5 C 150, 7 193, 50 195, 100 C 197, 150 150, 193 100, 195 C 50, 197 7, 150 5, 100 C 3, 50 50, 3 100, 5 Z" />
            <path d="M 100, 35 C 135, 36 165, 65 166, 100 C 167, 135 135, 165 100, 166 C 65, 167 34, 135 35, 100 C 36, 65 65, 34 100, 35 Z" stroke-dasharray="3 3" />
            <path d="M 100, 65 C 118, 65 137, 82 138, 100 C 139, 118 118, 137 100, 138 C 82, 139 62, 118 63, 100 C 64, 82 82, 64 100, 65 Z" />
        </svg>

        <!-- СТАТИЧНЫЙ СЛОЙ: Перекрестие (С легким, почти незаметным изгибом) -->
        <svg class="layer-absolute radar-lines-static" viewBox="0 0 200 200">
            <path d="M 100, 12 Q 99, 70 100.5, 100 T 100, 188" />
            <path d="M 12, 100 Q 70, 100.5 100, 99.5 T 188, 100" />
        </svg>

        <!-- ДИНАМИЧЕСКИЙ СЛОЙ: Слегка изгибающийся и пульсирующий луч со шлейфом -->
        <svg class="layer-absolute radar-sweep-container" viewBox="0 0 200 200">
            <defs>
                <radialGradient id="sweepGradient" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#006DF9" stop-opacity="0.45"/>
                    <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
                </radialGradient>
            </defs>
            
            <!-- Легкий шлейф -->
            <path class="sweep-glow" d="M 100,100 Q 104,50 100,5 C 122,12 140,45 100,100 Z" />
            
            <!-- Анимированная линия сканера с ультра-мягким колыханием (морфинг изгиба Q) -->
            <path class="sweep-line" d="M 100, 100 Q 103, 50 100, 5">
                <animate 
                    attributeName="d" 
                    dur="3s" 
                    repeatCount="indefinite"
                    values="M 100, 100 Q 103, 50 100, 5; 
                            M 100, 100 Q 98, 50 100, 5; 
                            M 100, 100 Q 105, 50 100, 5; 
                            M 100, 100 Q 103, 50 100, 5" 
                />
            </path>
        </svg>

    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        
        tg.expand();
        if (tg.requestFullscreen) {
            tg.requestFullscreen();
        }
        
        tg.setHeaderColor('#000000');
        tg.setBackgroundColor('#000000');
    </script>
</body>
</html>
