<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>СамоСобой</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif !important;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            overflow: hidden;
            height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Шапка приложения */
        header {
            position: absolute;
            top: var(--tg-safe-area-inset-top, env(safe-area-inset-top, 0px));
            left: 0;
            right: 0;
            height: 44px; 
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            pointer-events: none;
        }

        /* Контейнер радара (строго по центру экрана) */
        .radar-container {
            position: absolute;
            top: 48%; /* Чуть выше идеального центра оптически */
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60vw;
            height: 60vw; 
            max-width: 250px;
            max-height: 250px;
            aspect-ratio: 1 / 1;
            z-index: 10;
        }

        /* Центрирование слоев внутри радара */
        .layer-absolute {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transform-origin: center;
            overflow: visible;
        }

        /* --- ВОЛНОВЫЕ КРУГИ БЭКГРАУНДА --- */
        .circle-layer-1 {
            width: 100%; height: 100%;
            fill: #006DF9; 
            opacity: 0.75; 
            z-index: 1;
            animation: rotateCounter 25s linear infinite;
        }
        .circle-layer-2 {
            width: 114%; height: 114%;
            fill: #006DF9; 
            opacity: 0.35; 
            z-index: 1;
            animation: rotateClock 18s linear infinite;
        }
        .circle-layer-3 {
            width: 125%; height: 125%; 
            fill: #006DF9; 
            opacity: 0.15; 
            z-index: 1;
            animation: rotateCounter 30s linear infinite;
        }

        /* --- ДИНАМИЧЕСКИЕ ИМПУЛЬСНЫЕ КОЛЬЦА --- */
        .pulse-ring-container {
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }
        .pulse-ring-container path {
            fill: none;
            stroke: rgba(215, 235, 255, 0.4);
            stroke-width: 1.0;
            transform-origin: 100px 100px;
        }
        
        .ring-pulse-1 {
            animation: sonarPing 3.2s cubic-bezier(0.1, 0.4, 0.2, 1) infinite;
        }
        .ring-pulse-2 {
            animation: sonarPing 3.2s cubic-bezier(0.1, 0.4, 0.2, 1) infinite;
            animation-delay: 1.6s;
        }

        /* --- СТАТИЧНЫЙ КРЕСТ --- */
        .radar-lines-static {
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
        }
        .radar-lines-static path {
            fill: none;
            stroke: rgba(215, 235, 255, 0.22);
            stroke-width: 1;
        }

        /* --- ВРАЩЕНИЕ ЛУЧА ИЗ ЦЕНТРА --- */
        .sweep-spinner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(
                from 0deg, 
                transparent 40%, 
                rgba(0, 109, 249, 0.12) 75%,
                rgba(215, 235, 255, 0.35) 99%,
                rgba(215, 235, 255, 0.7) 100%
            );
            animation: sweepRotate 4s linear infinite;
            transform-origin: 50% 50%;
        }

        /* АНИМАЦИИ */
        @keyframes sonarPing {
            0% { transform: scale(0); opacity: 0.9; }
            50% { opacity: 0.5; }
            90% { opacity: 0; }
            100% { transform: scale(1.1); opacity: 0; }
        }
        @keyframes rotateClock {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
        @keyframes rotateCounter {
            0% { transform: translate(-50%, -50%) rotate(360deg); }
            100% { transform: translate(-50%, -50%) rotate(0deg); }
        }
        @keyframes sweepRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Шапка приложения -->
    <header>
        <div class="flex items-center space-x-2.5">
            <img 
                src="public/icons/logo.png" 
                alt="Логотип" 
                class="w-5 h-5 object-contain"
                onerror="this.style.display='none'"
            />
            <h1 class="text-base font-semibold tracking-tight text-white">
                СамоСобой
            </h1>
        </div>
    </header>

    <!-- Основной слой (Абсолютное центрирование радара) -->
    <main class="w-full h-full relative">
        
        <!-- Зона радара (остается на месте) -->
        <div class="radar-container">
            
            <!-- Слой 3 (Задний фон) -->
            <svg class="layer-absolute circle-layer-3" viewBox="0 0 200 200">
                <path d="M 100, 2 C 140, 10 180, 25 198, 90 C 215, 155 150, 195 100, 198 C 50, 201 -5, 150 2, 90 C 10, 30 60, -5 100, 2 Z" />
            </svg>

            <!-- Слой 2 (Средний) -->
            <svg class="layer-absolute circle-layer-2" viewBox="0 0 200 200">
                <path d="M 100, 5 C 135, 2 190, 30 195, 100 C 200, 170 145, 198 100, 195 C 55, 192 2, 160 5, 100 C 8, 40 65, 8 100, 5 Z" />
            </svg>

            <!-- Слой 1 (Передний основной круг) -->
            <svg class="layer-absolute circle-layer-1" viewBox="0 0 200 200">
                <path d="M 100, 5 C 150, 7 193, 50 195, 100 C 197, 150 150, 193 100, 195 C 50, 197 7, 150 5, 100 C 3, 50 50, 3 100, 5 Z" />
            </svg>

            <!-- ДИНАМИЧЕСКИЕ КОЛЬЦА -->
            <svg class="layer-absolute pulse-ring-container" viewBox="0 0 200 200">
                <path class="ring-pulse-1" d="M 100, 5 C 150, 7 193, 50 195, 100 C 197, 150 150, 193 100, 195 C 50, 197 7, 150 5, 100 C 3, 50 50, 3 100, 5 Z" />
                <path class="ring-pulse-2" d="M 100, 5 C 150, 7 193, 50 195, 100 C 197, 150 150, 193 100, 195 C 50, 197 7, 150 5, 100 C 3, 50 50, 3 100, 5 Z" />
            </svg>

            <!-- СТАТИЧНЫЙ КРЕСТ -->
            <svg class="layer-absolute radar-lines-static" viewBox="0 0 200 200">
                <path d="M 100, 12 Q 99, 70 100.5, 100 T 100, 188" />
                <path d="M 12, 100 Q 70, 100.5 100, 99.5 T 188, 100" />
            </svg>

            <!-- ВРАЩАЮЩИЙСЯ ЛУЧ (Вращается сам градиент внутри статической маски деформированного круга) -->
            <svg class="layer-absolute" viewBox="0 0 200 200" style="width:100%; height:100%; z-index:4; pointer-events:none;">
                <defs>
                    <clipPath id="radarClip">
                        <path d="M 100, 5 C 150, 7 193, 50 195, 100 C 197, 150 150, 193 100, 195 C 50, 197 7, 150 5, 100 C 3, 50 50, 3 100, 5 Z" />
                    </clipPath>
                </defs>
                <g clip-path="url(#radarClip)">
                    <foreignObject x="0" y="0" width="200" height="200">
                        <div xmlns="http://www.w3.org/1999/xhtml" class="sweep-spinner"></div>
                    </foreignObject>
                </g>
            </svg>

        </div>

        <!-- Нижняя темная плашка (Абсолютное позиционирование с отступами по 15px) -->
        <div class="absolute bottom-[15px] left-[15px] right-[15px] bg-[#1C1C1E] rounded-[24px] p-[15px] pt-[20px] flex flex-col z-20 shadow-xl border border-white/5">
            <p class="text-[14px] leading-relaxed font-medium text-white/85 text-center px-1 mb-5">
                Самое время поймать чей-нибудь кораблик! Сейчас в океане 
                <!-- Выделенный бейдж 999: Фон 0.2, полностью круглые углы, 5px по краям -->
                <span class="inline-flex items-center justify-center bg-white/20 text-white/95 px-[5px] py-[2px] mx-[2px] rounded-full font-semibold tracking-wide" style="transform: translateY(-1px);">999</span> 
                дрейфующих бортов, какой достанешь ты?
            </p>
            
            <!-- Кнопка Telegram (С круглыми углами, прижата вниз, 15px отступа обеспечивает родительский padding) -->
            <button class="w-full py-3.5 px-6 rounded-full text-[15px] font-semibold tracking-wide transition-transform active:scale-[0.98] bg-[#006DF9] text-white bg-[--tg-theme-button-color] text-[--tg-theme-button-text-color]">
                Поймать что-нибудь
            </button>
        </div>

    </main>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        
        tg.expand();
        if (tg.requestFullscreen) {
            tg.requestFullscreen();
        }
        
        tg.setHeaderColor('#000000');
        tg.setBackgroundColor('#000000');
    </script>
</body>
</html>
