<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>СамоСобой</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif !important;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            overflow: hidden;
            height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }

        header {
            position: absolute;
            top: var(--tg-safe-area-inset-top, env(safe-area-inset-top, 0px));
            left: 0;
            right: 0;
            height: 44px; 
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            pointer-events: none;
        }

        /* КОНТЕЙНЕР АНИМАЦИЙ */
        .radar-box {
            position: absolute;
            top: 40%; 
            left: 50%;
            transform: translate(-50%, -50%);
            width: 76vw;
            height: 76vw; 
            max-width: 310px;
            max-height: 310px;
            aspect-ratio: 1 / 1;
            z-index: 10;
        }

        .layer-center {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- ФОНОВЫЕ ОРГАНИЧЕСКИЕ СЛОИ (УВЕЛИЧЕННЫЕ) --- */
        .wave-1 { width: 120%; height: 120%; fill: #006DF9; opacity: 0.65; animation: rotCounter 24s linear infinite; }
        .wave-2-new { width: 140%; height: 140%; fill: #006DF9; opacity: 0.26; animation: rotClock 18s linear infinite; }
        .wave-3-new { width: 160%; height: 160%; fill: #006DF9; opacity: 0.10; animation: rotCounter 30s linear infinite; }

        /* --- ИМПУЛЬСНЫЕ КОЛЬЦА --- */
        .pulse-svg path {
            fill: none;
            stroke: rgba(215, 235, 255, 0.25);
            stroke-width: 1.0;
            transform-origin: 100px 100px;
        }
        .p-ring-1 { animation: sonar 3.5s cubic-bezier(0.1, 0.4, 0.2, 1) infinite; }
        .p-ring-2 { animation: sonar 3.5s cubic-bezier(0.1, 0.4, 0.2, 1) infinite; animation-delay: 1.75s; }

        /* --- ГОЛОГРАММА ЗЕМЛИ --- */
        .hologram-globe {
            width: 58%;
            height: 58%;
            position: relative;
            animation: floatGlobe 6s ease-in-out infinite;
            filter: drop-shadow(0 0 12px rgba(0, 109, 249, 0.6));
        }

        .globe-svg {
            width: 100%;
            height: 100%;
            animation: pulseGlow 4s alternate infinite;
        }

        /* АНИМАЦИИ */
        @keyframes rotClock { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes rotCounter { 0% { transform: rotate(360deg); } 100% { transform: rotate(0deg); } }
        @keyframes sonar {
            0% { transform: scale(0); opacity: 0.6; }
            70% { opacity: 0.2; }
            100% { transform: scale(1.15); opacity: 0; }
        }
        @keyframes floatGlobe {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-8px) scale(1.02); }
        }
        @keyframes pulseGlow {
            0% { filter: brightness(1); }
            100% { filter: brightness(1.25) drop-shadow(0 0 8px rgba(215, 235, 255, 0.4)); }
        }
    </style>
</head>
<body>

    <header>
        <div class="flex items-center space-x-2.5">
            <img src="public/icons/logo.png" alt="Логотип" class="w-5 h-5 object-contain" onerror="this.style.display='none'"/>
            <h1 class="text-base font-semibold tracking-tight text-white">СамоСобой</h1>
        </div>
    </header>

    <main class="w-full h-full relative">
        
        <div class="radar-box" id="radarZone">
            
            <!-- Фоновые волны (увеличены) -->
            <div class="layer-center z-1">
                <svg class="wave-3-new" viewBox="0 0 200 200"><path d="M 100, 2 C 140, 10 180, 25 198, 90 C 215, 155 150, 195 100, 198 C 50, 201 -5, 150 2, 90 C 10, 30 60, -5 100, 2 Z" /></svg>
            </div>

            <div class="layer-center z-2">
                <svg class="wave-2-new" viewBox="0 0 200 200"><path d="M 100, 5 C 135, 2 190, 30 195, 100 C 200, 170 145, 198 100, 195 C 55, 192 2, 160 5, 100 C 8, 40 65, 8 100, 5 Z" /></svg>
            </div>

            <div class="layer-center z-3">
                <svg class="wave-1" viewBox="0 0 200 200"><path d="M 100, 5 C 150, 7 193, 50 195, 100 C 197, 150 150, 193 100, 195 C 50, 197 7, 150 5, 100 C 3, 50 50, 3 100, 5 Z" /></svg>
            </div>

            <!-- Импульсные кольца -->
            <div class="layer-center z-4 pointer-events-none">
                <svg class="pulse-svg w-full h-full" viewBox="0 0 200 200">
                    <path class="p-ring-1" d="M 100, 5 C 150, 7 193, 50 195, 100 C 197, 150 150, 193 100, 195 C 50, 197 7, 150 5, 100 C 3, 50 50, 3 100, 5 Z" />
                    <path class="p-ring-2" d="M 100, 5 C 150, 7 193, 50 195, 100 C 197, 150 150, 193 100, 195 C 50, 197 7, 150 5, 100 C 3, 50 50, 3 100, 5 Z" />
                </svg>
            </div>

            <!-- ЦЕНТРАЛЬНАЯ ГОЛОГРАММА -->
            <div class="layer-center z-10 pointer-events-none">
                <div class="hologram-globe">
                    <svg class="globe-svg" viewBox="0 0 200 200">
                        <defs>
                            <!-- Свечение сферы -->
                            <radialGradient id="sphereGrad" cx="50%" cy="50%" r="50%">
                                <stop offset="0%" stop-color="#006DF9" stop-opacity="0.0"/>
                                <stop offset="65%" stop-color="#006DF9" stop-opacity="0.15"/>
                                <stop offset="90%" stop-color="#006DF9" stop-opacity="0.4"/>
                                <stop offset="100%" stop-color="#DCEBFC" stop-opacity="0.7"/>
                            </radialGradient>
                            <clipPath id="globeClip">
                                <circle cx="100" cy="100" r="98" />
                            </clipPath>
                        </defs>
                        
                        <!-- Базовая сфера -->
                        <circle cx="100" cy="100" r="98" fill="url(#sphereGrad)" stroke="#006DF9" stroke-width="1.5" opacity="0.9"/>
                        
                        <!-- Сетка (Параллели) -->
                        <ellipse cx="100" cy="100" rx="98" ry="25" fill="none" stroke="#006DF9" stroke-width="0.75" opacity="0.35" />
                        <ellipse cx="100" cy="100" rx="98" ry="55" fill="none" stroke="#006DF9" stroke-width="0.75" opacity="0.35" />
                        <ellipse cx="100" cy="100" rx="98" ry="80" fill="none" stroke="#006DF9" stroke-width="0.75" opacity="0.35" />
                        
                        <!-- Сетка (Меридианы) -->
                        <ellipse cx="100" cy="100" rx="25" ry="98" fill="none" stroke="#006DF9" stroke-width="0.75" opacity="0.35" />
                        <ellipse cx="100" cy="100" rx="55" ry="98" fill="none" stroke="#006DF9" stroke-width="0.75" opacity="0.35" />
                        <ellipse cx="100" cy="100" rx="80" ry="98" fill="none" stroke="#006DF9" stroke-width="0.75" opacity="0.35" />

                        <!-- Стилизованные материки -->
                        <g clip-path="url(#globeClip)" fill="#DCEBFC" opacity="0.85">
                            <!-- Северная Америка -->
                            <path d="M35,35 C25,50 35,65 50,60 C65,55 75,40 65,25 C55,10 45,20 35,35 Z" />
                            <!-- Южная Америка -->
                            <path d="M55,75 C45,95 55,130 65,150 C75,130 85,95 75,75 C65,55 65,55 55,75 Z" />
                            <!-- Евразия -->
                            <path d="M90,30 C75,45 85,75 110,70 C135,65 175,55 160,35 C145,15 105,15 90,30 Z" />
                            <!-- Африка -->
                            <path d="M95,75 C85,95 90,130 105,125 C120,120 135,95 125,75 C115,55 105,55 95,75 Z" />
                            <!-- Австралия -->
                            <path d="M140,110 C130,120 135,140 150,135 C165,130 170,115 160,105 C150,95 150,100 140,110 Z" />
                            <!-- Мелкие острова -->
                            <circle cx="140" cy="85" r="4" />
                            <circle cx="170" cy="95" r="3" />
                            <circle cx="80" cy="140" r="2" />
                            <circle cx="45" cy="110" r="2.5" />
                        </g>
                    </svg>
                </div>
            </div>

        </div>

        <!-- НИЖНЯЯ ПАНЕЛЬ (Скругление увеличено до 36px) -->
        <div class="absolute bottom-[15px] left-[15px] right-[15px] h-[275px] bg-[#1C1C1E] rounded-[36px] border-none p-4 flex flex-col justify-between z-20 shadow-2xl overflow-hidden select-none">
            
            <div class="w-full bg-white/[0.04] rounded-full p-1 flex relative items-center h-11">
                <div id="chooser-bg" class="absolute inset-y-1 left-1 w-[calc(50%-4px)] bg-white/[0.09] backdrop-blur-xl rounded-full z-0 transition-transform duration-300 ease-[cubic-bezier(0.25,1,0.5,1)]"></div>
                
                <button onclick="switchTab('ships', this)" class="flex-1 h-full relative z-10 text-[13.5px] font-semibold tracking-tight text-white text-center">
                    Кораблики
                </button>
                <button onclick="switchTab('friends', this)" class="flex-1 h-full relative z-10 text-[13.5px] font-semibold tracking-tight text-white/30 text-center">
                    Друзья (0)
                </button>
            </div>

            <div class="flex-1 flex items-center justify-center px-2 py-2">
                <p class="text-[14px] leading-relaxed font-medium text-white/80 text-center">
                    Самое время поймать чей-нибудь кораблик! Сейчас в океане 
                    <span class="inline-flex items-center justify-center bg-white/20 text-white px-[6px] py-[1.5px] mx-[2px] rounded-full font-bold text-[13px] tracking-wide" style="transform: translateY(-0.5px);">999</span> 
                    дрейфующих бортов, какой достанешь ты?
                </p>
            </div>
            
            <button class="w-full py-3.5 px-6 rounded-full text-[15px] font-semibold tracking-wide transition-all active:scale-[0.98] bg-[#006DF9] text-white bg-[--tg-theme-button-color] text-[--tg-theme-button-text-color]">
                Поймать что-нибудь
            </button>
        </div>

    </main>

    <script>
        // Интеграция Telegram WebApp
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
            if (tg.requestFullscreen) tg.requestFullscreen();
            tg.setHeaderColor('#000000');
            tg.setBackgroundColor('#000000');
        }

        // Логика кастомного переключателя вкладок
        function switchTab(tab, btn) {
            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
            
            const bg = document.getElementById('chooser-bg');
            const buttons = btn.parentNode.querySelectorAll('button');
            
            buttons.forEach(b => {
                b.classList.remove('text-white');
                b.classList.add('text-white/30');
            });
            
            btn.classList.remove('text-white/30');
            btn.classList.add('text-white');
            
            if (tab === 'ships') {
                bg.style.transform = 'translateX(0%)';
            } else {
                const containerWidth = btn.parentNode.offsetWidth;
                const offset = (containerWidth / 2) - 6;
                bg.style.transform = `translateX(${offset}px)`;
            }
        }
    </script>
</body>
</html>
