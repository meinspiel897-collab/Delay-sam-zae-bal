<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>СамоСобой</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Подключаем плеер для Lottie JSON анимаций -->
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif !important;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Главный контейнер радара и волновых кругов (увеличен до 72vw) */
        .radar-container {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 72vw;
            max-width: 290px;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .circle-wave-layer {
            position: absolute;
            transform-origin: center;
            fill: #006DF9;
        }

        /* 1. ПЕРЕДНИЙ КРУГ — Почти не искажен, идеальная форма */
        .circle-layer-1 {
            width: 100%;
            height: 100%;
            opacity: 0.9;
            animation: rotateCounterClockwise 25s linear infinite;
            z-index: 3;
        }

        /* 2. СРЕДНИЙ КРУГ — Чуть крупнее, со средними изгибами */
        .circle-layer-2 {
            width: 114%;
            height: 114%;
            opacity: 0.45;
            animation: rotateClockwise 18s linear infinite;
            z-index: 2;
        }

        /* 3. ЗАДНИЙ КРУГ — Максимальный волновой шлейф */
        .circle-layer-3 {
            width: 126%;
            height: 126%;
            opacity: 0.15;
            animation: rotateCounterClockwise 30s linear infinite;
            z-index: 1;
        }

        /* СЕТКА РАДАРА — Вписана поверх кругов, не выходит за рамки */
        .radar-grid {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 4;
            pointer-events: none;
        }

        /* ЛОТТИ КИТ — Размещен по центру, чуть меньше первого круга */
        .lottie-whale-box {
            position: absolute;
            width: 80%;
            height: 80%;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            /* Анимация появления на 5 секунд */
            animation: whaleFading 5s ease-in-out infinite;
        }

        /* Тайминги: Быстрое появление -> 3 секунды горит -> Быстрое исчезновение */
        @keyframes whaleFading {
            0% { opacity: 0; }
            10% { opacity: 1; }  /* Быстрое появление за 0.5 сек (10% от 5 сек) */
            70% { opacity: 1; }  /* Держится видимым 3 секунды (до 70%) */
            80% { opacity: 0; }  /* Быстро исчезает за 0.5 сек (до 80%) */
            100% { opacity: 0; } /* Остаток цикла спит в темноте */
        }

        @keyframes rotateClockwise {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes rotateCounterClockwise {
            0% { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }
    </style>
</head>
<body>

    <!-- Шапка оптимизирована под безопасную зону Telegram Mini App -->
    <header class="w-full flex justify-center z-50 pt-[var(--tg-viewport-safe-area-inset-top,24px)]">
        <div class="flex items-center space-x-2.5 py-2">
            <img 
                src="public/icons/logo.png" 
                alt="Логотип" 
                class="w-5 h-5 object-contain"
                onerror="this.style.display='none'"
            />
            <h1 class="text-base font-semibold tracking-tight text-white uppercase">
                СамоСобой
            </h1>
        </div>
    </header>

    <!-- Главная рабочая зона: Радар + Живые круги + Кит -->
    <div class="radar-container">
        
        <!-- Слой 1: Передний (Почти идеальный ровный круг с микро-деформацией) -->
        <svg class="circle-wave-layer circle-layer-1" viewBox="0 0 200 200">
            <path d="M 100, 15 
                     C 146, 15  185, 54  185, 100 
                     C 185, 146 146, 185 100, 185 
                     C 54,  185 15,  146 15,  100 
                     C 15,  54  54,  15  100, 15 Z" />
        </svg>

        <!-- Слой 2: Средний (Пропорционально крупнее, волновые выступы) -->
        <svg class="circle-wave-layer circle-layer-2" viewBox="0 0 200 200">
            <path d="M 100, 12 
                     C 125, 10  138, 30  154, 36 
                     C 170, 42  190, 58  186, 82 
                     C 182, 106 188, 128 174, 145 
                     C 160, 162 136, 185 110, 188
                     C 84,  191 61,  176 46,  166
                     C 31,  156 12,  136 14,  112
                     C 16,  88  12,  62  30,  44
                     C 48,  26  75,  14  100, 12 Z" />
        </svg>

        <!-- Слой 3: Задний (Самый размашистый по волнам) -->
        <svg class="circle-wave-layer circle-layer-3" viewBox="0 0 200 200">
            <path d="M 100, 8
                     C 130, 5   145, 22  165, 30
                     C 185, 38  195, 65  192, 92
                     C 189, 119 192, 142 178, 160
                     C 164, 178 132, 194 105, 194
                     C 78,  194 50,  182 35,  165
                     C 20,  148 8,   125 10,  95
                     C 12,  65  22,  38  42,  24
                     C 62,  10  70,  11  100, 8 Z" />
        </svg>

        <!-- Тонкая сетка морского радара, аккуратно наложенная поверх кругов -->
        <svg class="radar-grid" viewBox="0 0 200 200">
            <!-- Внутренние кольца разметки -->
            <circle cx="100" cy="100" r="70" fill="none" stroke="#006DF9" stroke-width="0.5" opacity="0.25" stroke-dasharray="3 3" />
            <circle cx="100" cy="100" r="40" fill="none" stroke="#006DF9" stroke-width="0.5" opacity="0.2" />
            <!-- Перекрестные визирные линии -->
            <line x1="100" y1="10" x2="100" y2="190" stroke="#006DF9" stroke-width="0.5" opacity="0.15" />
            <line x1="10" y1="100" x2="190" y2="100" stroke="#006DF9" stroke-width="0.5" opacity="0.15" />
        </svg>

        <!-- Контейнер с Lottie-анимацией Кита -->
        <div class="lottie-whale-box">
            <lottie-player 
                src="public/gifs/whale.json" 
                background="transparent" 
                speed="1" 
                loop 
                autoplay
                style="width: 100%; height: 100%;">
            </lottie-player>
        </div>

    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        
        tg.setHeaderColor('#000000');
        tg.setBackgroundColor('#000000');
    </script>
</body>
</html>
