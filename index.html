<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>СамоСобой Mini App</title>
    <!-- Telegram WebApp JS SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Шрифт Manrope -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Manrope', sans-serif;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            background-color: #000000; /* Абсолютный черный OLED фон */
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }

        /* Анимированные перекатывающиеся белые волны iOS 26 */
        @keyframes waveAnimation {
            0% {
                transform: translateX(0) translateZ(0) scaleY(1);
            }
            50% {
                transform: translateX(-25%) translateZ(0) scaleY(0.85);
            }
            100% {
                transform: translateX(-50%) translateZ(0) scaleY(1);
            }
        }

        .wave-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 200%;
            height: 180px;
            pointer-events: none;
            overflow: hidden;
            opacity: 0.18; /* Сделали волны заметнее и светлее */
        }

        .wave-svg {
            position: absolute;
            bottom: -5px;
            width: 100%;
            height: 100%;
            animation: waveAnimation 16s cubic-bezier(0.37, 0, 0.63, 1) infinite;
            transform-origin: bottom center;
        }

        /* Стильный размытый бэкграунд в стиле iOS 26 для интерактивной карточки */
        .glass-panel {
            background: rgba(18, 18, 20, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="h-screen w-full text-white flex flex-col justify-between items-center relative">
    
    <!-- Шапка приложения (Header в стиле iOS 26: заголовок + лого без фона) -->
    <div class="w-full flex items-center justify-between px-6 pt-5 pb-4 border-b border-zinc-950 z-20">
        <!-- Левая часть: логотип без подложки и название по центру оси X -->
        <div class="flex items-center space-x-2.5">
            <img 
                src="public/icons/logo.png" 
                alt="СамоСобой" 
                class="w-7 h-7 object-contain"
                onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'%23ffffff\'><path d=\'M4 14h16v1h-1v1h-1v1H6v-1H5v-1H4v-1zm4-1h1v-1H8v1zm3 0h1v-3h-1v3zm3 0h1v-5h-1v5z\' /></svg>';"
            />
            <span class="text-lg font-bold tracking-tight text-white">СамоСобой</span>
        </div>
        <!-- Правая часть: минималистичный статус -->
        <div class="flex items-center space-x-1.5">
            <span class="text-[9px] text-zinc-500 uppercase tracking-widest font-bold">Океан</span>
            <div class="h-1.5 w-1.5 rounded-full bg-blue-500"></div>
        </div>
    </div>

    <!-- Центральный контент в стиле карточек iOS 26 -->
    <div class="w-full max-w-sm px-6 flex flex-col items-center justify-center flex-grow z-10 text-center">
        <div class="glass-panel w-full py-10 px-6 rounded-3xl shadow-2xl">
            <!-- Символ бесконечного плавания -->
            <div class="w-12 h-12 rounded-full bg-zinc-900 border border-zinc-800 flex items-center justify-center mb-6 mx-auto">
                <svg class="w-6 h-6 text-zinc-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                </svg>
            </div>
            
            <h2 class="text-xl font-bold mb-3 tracking-tight text-white">Гавань на реконструкции</h2>
            <p class="text-zinc-400 text-xs leading-relaxed max-w-[240px] mx-auto font-medium">
                Мы вовсю готовим пирсы к запуску. Скоро здесь появятся твои активные чаты и выловленные мысли.
            </p>
        </div>
    </div>

    <!-- Нижний бар с кнопкой и копирайтом -->
    <div class="w-full relative flex flex-col items-center pb-8 z-10">
        <!-- Минималистичная кнопка действия iOS 26 -->
        <button onclick="closeApp()" class="px-10 py-3.5 bg-white text-black hover:bg-zinc-200 active:scale-95 transition-all text-xs font-bold uppercase tracking-widest rounded-full shadow-lg mb-8">
            Вернуться в бот
        </button>

        <p class="text-[8px] text-zinc-600 tracking-[0.4em] uppercase font-bold">все сложится само собой • 2026</p>
    </div>

    <!-- Анимированные светлые белые волны -->
    <div class="wave-container">
        <svg class="wave-svg" viewBox="0 0 1200 120" preserveAspectRatio="none">
            <path d="M0,60 C150,100 350,20 500,60 C650,100 850,20 1000,60 C1150,100 1350,20 1500,60 L1500,120 L0,120 Z" fill="#ffffff"></path>
        </svg>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        
        tg.ready();
        tg.expand();

        // Устанавливаем системные цвета ТГ в глубокий черный
        tg.setHeaderColor('#000000');
        tg.setBackgroundColor('#000000');

        function closeApp() {
            tg.close();
        }
    </script>
</body>
</html>
