<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>СамоСобой</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* Глубокий OLED черный фон */
        body {
            font-family: 'Inter', sans-serif !important;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Контейнер для трех центральных волновых кругов */
        .circle-wave-container {
            position: absolute;
            top: 55%; /* Центрирование с учетом шторки Telegram */
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60vw; /* Базовый размер для самого верхнего круга */
            max-width: 240px;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .circle-wave-layer {
            position: absolute;
            transform-origin: center;
            fill: #006DF9; /* Единый акцентный цвет для всех слоев */
        }

        /* 1. ПЕРЕДНИЙ КРУГ (Основной, самый плотный) */
        .circle-layer-1 {
            width: 100%;
            height: 100%;
            opacity: 0.9; /* Высокая плотность по вашему запросу */
            animation: rotateCounterClockwise 14s linear infinite;
            z-index: 3;
        }

        /* 2. СРЕДНИЙ КРУГ (Чуть крупнее, средняя прозрачность) */
        .circle-layer-2 {
            width: 112%; /* Пропорционально больше */
            height: 112%;
            opacity: 0.45; /* Отталкиваемся вниз от 0.9 */
            animation: rotateClockwise 20s linear infinite;
            z-index: 2;
        }

        /* 3. ЗАДНИЙ КРУГ (Еще капельку крупнее, самый воздушный) */
        .circle-layer-3 {
            width: 122%; /* Еще немного крупнее */
            height: 122%;
            opacity: 0.15; /* Мягкий фоновый контур */
            animation: rotateCounterClockwise 28s linear infinite;
            z-index: 1;
        }

        /* Анимации вращения слоев */
        @keyframes rotateClockwise {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes rotateCounterClockwise {
            0% { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }
    </style>
</head>
<body>

    <!-- Шапка с динамическим отступом под safe-area Telegram Mini App -->
    <header class="w-full flex justify-center z-50 pt-[var(--tg-viewport-safe-area-inset-top,24px)]">
        <div class="flex items-center space-x-2.5 py-2">
            <!-- Логотип -->
            <img 
                src="public/icons/logo.png" 
                alt="Логотип" 
                class="w-5 h-5 object-contain"
                onerror="this.style.display='none'"
            />
            <!-- Заголовок, который теперь точно не залезет под системные кнопки -->
            <h1 class="text-base font-semibold tracking-tight text-white uppercase">
                СамоСобой
            </h1>
        </div>
    </header>

    <!-- Центрированные волновые круги -->
    <div class="circle-wave-container">
        
        <!-- Слой 1: Передний (Плотность 0.9, аккуратные волновые выступы) -->
        <svg class="circle-wave-layer circle-layer-1" viewBox="0 0 200 200">
            <path d="M 100, 16 
                     C 128, 14  142, 25  160, 40 
                     C 178, 55  185, 82  183, 102 
                     C 181, 122 172, 145, 158, 158 
                     C 144, 171 122, 182 100, 182
                     C 78,  182 56,  173 42,  158
                     C 28,  143 18,  122 18,  102
                     C 18,  82  24,  55  42,  40
                     C 60,  25  72,  18  100, 16 Z" />
        </svg>

        <!-- Слой 2: Средний (Пропорционально больше, обратное вращение) -->
        <svg class="circle-wave-layer circle-layer-2" viewBox="0 0 200 200">
            <path d="M 100, 12 
                     C 125, 10  138, 30  154, 36 
                     C 170, 42  190, 58  186, 82 
                     C 182, 106 188, 128 174, 145 
                     C 160, 162 136, 185 110, 188
                     C 84,  191 61,  176 46,  166
                     C 31,  156 12,  136 14,  112
                     C 16,  88  12,  62  30,  44
                     C 48,  26  75,  14  100, 12 Z" />
        </svg>

        <!-- Слой 3: Задний (Самый крупный, создает глубокий шлейф волновых выступов) -->
        <svg class="circle-wave-layer circle-layer-3" viewBox="0 0 200 200">
            <path d="M 100, 8
                     C 130, 5   145, 22  165, 30
                     C 185, 38  195, 65  192, 92
                     C 189, 119 192, 142 178, 160
                     C 164, 178 132, 194 105, 194
                     C 78,  194 50,  182 35,  165
                     C 20,  148 8,   125 10,  95
                     C 12,  65  22,  38  42,  24
                     C 62,  10  70,  11  100, 8 Z" />
        </svg>

    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        
        // Окрашиваем статус-бар Telegram в глубокий черный
        tg.setHeaderColor('#000000');
        tg.setBackgroundColor('#000000');
    </script>
</body>
</html>
