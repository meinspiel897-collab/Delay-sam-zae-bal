<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>СамоСобой</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Подключаем официальный плеер Lottie -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif !important;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Контейнер радара (Сделали крупнее) */
        .radar-container {
            position: absolute;
            top: 55%;
            left: 50+%;
            transform: translate(-50%, -50%);
            width: 75vw; 
            max-width: 300px;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .circle-wave-layer {
            position: absolute;
            transform-origin: center;
            fill: #006DF9;
        }

        /* 1. ПЕРЕДНИЙ КРУГ — теперь почти идеально ровный */
        .circle-layer-1 {
            width: 100%;
            height: 100%;
            opacity: 0.9;
            animation: rotateCounterClockwise 25s linear infinite;
            z-index: 3;
        }

        /* 2. СРЕДНИЙ КРУГ — волнообразный */
        .circle-layer-2 {
            width: 115%; 
            height: 115%;
            opacity: 0.4;
            animation: rotateClockwise 16s linear infinite;
            z-index: 2;
        }

        /* 3. ЗАДНИЙ КРУГ — сильно волнообразный */
        .circle-layer-3 {
            width: 130%; 
            height: 130%;
            opacity: 0.12;
            animation: rotateCounterClockwise 22s linear infinite;
            z-index: 1;
        }

        /* СЕТКА РАДАРА (Поверх кругов) */
        .radar-grid {
            position: absolute;
            width: 130%;
            height: 130%;
            z-index: 4;
            pointer-events: none;
        }

        /* СКАНЕР (Вращающийся луч радара с конусным градиентом) */
        .radar-sweep {
            position: absolute;
            width: 130%;
            height: 130%;
            border-radius: 50%;
            background: conic-gradient(from 0deg, rgba(0, 109, 249, 0.4) 0deg, rgba(0, 109, 249, 0) 90deg);
            z-index: 5;
            pointer-events: none;
            animation: radarSweepAnimation 4s linear infinite;
        }

        /* КОНТЕЙНЕР ДЛЯ КИТА LOTTIE (Внутри первого круга) */
        #lottie-whale {
            position: absolute;
            width: 85%;
            height: 85%;
            z-index: 10;
            pointer-events: none;
            opacity: 0; /* Изначально скрыт */
            transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1); /* Плавное быстрое появление/исчезновение */
        }

        /* Анимации вращения */
        @keyframes rotateClockwise {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes rotateCounterClockwise {
            0% { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }

        @keyframes radarSweepAnimation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Шапка адаптированная под Mini App -->
    <header class="w-full flex justify-center z-50 pt-[var(--tg-viewport-safe-area-inset-top,24px)]">
        <div class="flex items-center space-x-2.5 py-2">
            <img 
                src="public/icons/logo.png" 
                alt="Логотип" 
                class="w-5 h-5 object-contain"
                onerror="this.style.display='none'"
            />
            <h1 class="text-base font-semibold tracking-tight text-white uppercase">
                СамоСобой
            </h1>
        </div>
    </header>

    <!-- Главная зона радара -->
    <div class="radar-container">
        
        <!-- Слой 1: Передний (Округлая правильная форма) -->
        <svg class="circle-wave-layer circle-layer-1" viewBox="0 0 200 200">
            <!-- Минимальные искажения, форма стремится к идеальному кругу -->
            <path d="M 100, 15 
                     C 146, 15  185, 54  185, 100 
                     C 185, 146 146, 185 100, 185 
                     C 54,  185 15,  146 15,  100 
                     C 15,  54  54,  15  100, 15 Z" />
        </svg>

        <!-- Слой 2: Средний (Волновые выступы) -->
        <svg class="circle-wave-layer circle-layer-2" viewBox="0 0 200 200">
            <path d="M 100, 12 
                     C 125, 10  138, 30  154, 36 
                     C 170, 42  190, 58  186, 82 
                     C 182, 106 188, 128 174, 145 
                     C 160, 162 136, 185 110, 188
                     C 84,  191 61,  176 46,  166
                     C 31,  156 12,  136 14,  112
                     C 16,  88  12,  62  30,  44
                     C 48,  26  75,  14  100, 12 Z" />
        </svg>

        <!-- Слой 3: Задний (Выразительные выступы) -->
        <svg class="circle-wave-layer circle-layer-3" viewBox="0 0 200 200">
            <path d="M 100, 8
                     C 130, 5   145, 22  165, 30
                     C 185, 38  195, 65  192, 92
                     C 189, 119 192, 142 178, 160
                     C 164, 178 132, 194 105, 194
                     C 78,  194 50,  182 35,  165
                     C 20,  148 8,   125 10,  95
                     C 12,  65  22,  38  42,  24
                     C 62,  10  70,  11  100, 8 Z" />
        </svg>

        <!-- Сетка морского радара -->
        <svg class="radar-grid" viewBox="0 0 260 260">
            <!-- Внешнее кольцо сетки -->
            <circle cx="130" cy="130" r="128" fill="none" stroke="#006DF9" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="4 4" />
            <!-- Среднее кольцо -->
            <circle cx="130" cy="130" r="95" fill="none" stroke="#006DF9" stroke-width="1" stroke-opacity="0.2" />
            <!-- Внутреннее кольцо -->
            <circle cx="130" cy="130" r="60" fill="none" stroke="#006DF9" stroke-width="1" stroke-opacity="0.15" />
            
            <!-- Перекрестие (Оси радара) -->
            <line x1="130" y1="2" x2="130" y2="258" stroke="#006DF9" stroke-width="1" stroke-opacity="0.15" />
            <line x1="2" y1="130" x2="258" y2="130" stroke="#006DF9" stroke-width="1" stroke-opacity="0.15" />
        </svg>

        <!-- Вращающийся луч радара -->
        <div class="radar-sweep"></div>

        <!-- Контейнер для анимации кита -->
        <div id="lottie-whale"></div>

    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        tg.setHeaderColor('#000000');
        tg.setBackgroundColor('#000000');

        // Инициализация Lottie-анимации
        const whaleContainer = document.getElementById('lottie-whale');
        const whaleAnimation = lottie.loadAnimation({
            container: whaleContainer,
            renderer: 'svg',
            loop: true,
            autoplay: true,
            path: 'public/gifs/whale.json' // Путь к вашему файлу
        });

        // Цикл появления и исчезновения кита по таймингу
        function runWhaleCycle() {
            // Плавно и быстро показываем
            whaleContainer.style.opacity = '1';

            // Через 3 секунды плавно и быстро скрываем
            setTimeout(() => {
                whaleContainer.style.opacity = '0';
            }, 3000);
        }

        // Запуск цикла каждые 5 секунд
        setInterval(runWhaleCycle, 5000);
        
        // Первый запуск сразу при загрузке
        setTimeout(runWhaleCycle, 400);
    </script>
</body>
</html>
